<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel ForgePlayID</title>

<style>
body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background-color: #020617;
    color: white;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background-color: #0f172a;
    border-bottom: 1px solid #1e293b;
}
.header a {
    color: #38bdf8;
    text-decoration: none;
    font-weight: 600;
}
.container {
    max-width: 500px;
    margin: 100px auto;
    padding: 0 15px;
    text-align: center;
}
h1 {
    color: #38bdf8;
    text-align: center;
    margin-bottom: 20px;
}
input,
button {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
}
button {
    background-color: #38bdf8;
    color: #020617;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
}
button:hover {
    background-color: #0ea5e9;
}
.admin-panel {
    background-color: #1e293b;
    padding: 20px;
    border-radius: 12px;
    margin-top: 30px;
}
.admin-panel h2 {
    margin-top: 0;
    color: #38bdf8;
}
</style>
</head>
<body>

<div class="header">
    <a href="#">Admin Panel ForgePlayID</a>
</div>

<div class="container">
    <!-- LOGIN SIMPLE -->
    <div id="login-panel" class="admin-panel">
        <h2>Login Admin</h2>
        <input type="password" id="admin-password" placeholder="Masukkan password" />
        <button onclick="loginAdmin()">Login</button>
    </div>

    <!-- ADMIN CONTROL (tetap ada tapi tersembunyi) -->
    <div id="admin-controls" class="admin-panel" style="display:none;">
        <h2>Kontrol Admin</h2>
        <p>Selamat datang, admin! Panel ini akan muncul setelah login berhasil.</p>
    </div>
</div>

<script>
// ==== ADMIN LOGIN DENGAN REDIRECT DAN PENYIMPANAN STATUS LOGIN ====
const adminPass = "admin123"; // ganti sesuai kebutuhan
function loginAdmin() {
    const input = document.getElementById("admin-password").value;
    console.log("Password input:", input);
    if (input === adminPass) {
        console.log("Password benar, simpan status login dan redirect ke dashboard...");
        localStorage.setItem("admin_login", "true"); // simpan flag login
        window.location.assign("https://forgeplayid.github.io/panel/dashboard.html");
    } else {
        alert("Password salah!");
    }
}
</script>

</body>
</html>
