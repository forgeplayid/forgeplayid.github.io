<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List World</title>

<style>
body {
  font-family: Arial;
  background: #020617;
  color: white;
  margin: 0;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;
}

.logo img { height:40px; }

.header-right a {
  display:inline-block;
  padding:6px 14px;
  font-weight:bold;
  border-radius:6px;
  text-decoration:none;
  color:white;
  background:#ef4444;
  font-size:13px;
}

/* LAYOUT */
.layout {
  display:flex;
  min-height: calc(100vh - 70px);
}

/* SIDEBAR */
.sidebar {
  width:180px;
  background:#0f172a;
  border-right:1px solid #1e293b;
  padding:15px 10px;
}

.menu {
  display:block;
  padding:10px;
  margin-bottom:8px;
  background:#1e293b;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-size:13px;
}

.menu:hover {
  background:#38bdf8;
  color:#020617;
}

/* CONTENT */
.content {
  flex:1;
  padding:30px;
}

.card {
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  max-width:600px;
  margin-bottom:20px;
}

/* FORM */
label {
  color:#38bdf8;
  font-size:13px;
}

input, textarea, select {
  width:100%;
  padding:10px;
  margin:6px 0 12px 0;
  border:none;
  border-radius:6px;
}

textarea {
  height:100px;
  resize:none;
}

/* BUTTON */
button {
  width:100%;
  padding:10px;
  background:#38bdf8;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

button:hover {
  background:#0ea5e5;
}

/* STATUS */
small {
  display:block;
  margin-top:10px;
  color:#94a3b8;
  min-height:20px;
}

/* LIST */
.world-item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0f172a;
  padding:10px;
  margin-top:8px;
  border-radius:6px;
}

.actions button {
  width:auto;
  padding:5px 8px;
  font-size:12px;
  margin-left:5px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <a href="dashboard.html">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png">
    </a>
  </div>

  <div class="header-right">
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <a class="menu" href="dashboard.html">Dashboard</a>
    <a class="menu" href="price.html">List Harga</a>
    <a class="menu" href="world.html">List World</a>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- FORM -->
    <div class="card">
      <h3 style="color:#38bdf8;">List World</h3>

      <label>Name</label>
      <input type="text" id="name">

      <label>Link Gambar (1280x798)</label>
      <input type="text" id="image">

      <label>Deskripsi</label>
      <textarea id="desc"></textarea>

      <label>Status</label>
      <select id="status">
        <option value="READY">READY</option>
        <option value="SOLD">SOLD</option>
      </select>

      <button id="addBtn">~~~~~ TAMBAH WORLD ~~~~~</button>
      <small id="msg"></small>
    </div>

    <!-- LIST -->
    <div class="card">
      <h3 style="color:#38bdf8;">Daftar World</h3>
      <div id="list"></div>
    </div>

  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzU0WG8W524Vn6LpnbRjhZIrc19Xvle31Os3LskY2gqkBEmQ_CHj44q6NXtJQagbhmTGA/exec";

let worlds = [];

/* STATUS */
function showMsg(msg, ok=true){
  const el = document.getElementById("msg");
  el.textContent = msg;
  el.style.color = ok ? "#38bdf8" : "#ef4444";
  setTimeout(()=>el.textContent="",3000);
}

/* LOAD */
async function loadWorld(){
  const res = await fetch(SCRIPT_URL + "?action=world");
  worlds = await res.json();
  render();
}

/* RENDER */
function render(){
  const el = document.getElementById("list");
  el.innerHTML = "";

  if(worlds.length === 0){
    el.innerHTML = "<small>Belum ada data</small>";
    return;
  }

  worlds.forEach((w,i)=>{
    el.innerHTML += `
      <div class="world-item">
        <span>${i+1}. ${w.name} (${w.status})</span>
        <div class="actions">
          <button onclick="edit(${i})">EDIT</button>
          <button onclick="del(${i})">DEL</button>
        </div>
      </div>
    `;
  });
}

/* ADD */
document.getElementById("addBtn").addEventListener("click", async ()=>{

  const data = {
    action:"add_world",
    name:document.getElementById("name").value,
    image:document.getElementById("image").value,
    desc:document.getElementById("desc").value,
    status:document.getElementById("status").value
  };

  if(!data.name || !data.image || !data.desc){
    showMsg("❌ Lengkapi data!", false);
    return;
  }

  await fetch(SCRIPT_URL,{
    method:"POST",
    body: JSON.stringify(data)
  });

  showMsg("✅ World ditambahkan!");
  loadWorld();
});

/* EDIT */
function edit(i){
  let st = prompt("READY / SOLD", worlds[i].status);

  if(st !== "READY" && st !== "SOLD"){
    showMsg("❌ Hanya READY/SOLD", false);
    return;
  }

  fetch(SCRIPT_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"edit_world",
      id:worlds[i].id,
      status:st
    })
  });

  showMsg("✅ Updated!");
  setTimeout(loadWorld,500);
}

/* DELETE */
function del(i){
  if(!confirm("Hapus world ini?")) return;

  fetch(SCRIPT_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"delete_world",
      id:worlds[i].id
    })
  });

  showMsg("🗑 Deleted!");
  setTimeout(loadWorld,500);
}

/* LOGOUT */
document.getElementById("logoutBtn").onclick = (e)=>{
  e.preventDefault();
  localStorage.removeItem("admin_login");
  window.location.href="login.html";
};

loadWorld();
</script>

</body>
</html>
