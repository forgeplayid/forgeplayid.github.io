<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List World Admin</title>

<style>
body {
  font-family: Arial;
  background: #020617;
  color: white;
  margin: 0;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;
}

.logo img { height:40px; }

.header-right a {
  display:inline-block;
  padding:6px 14px;
  font-weight:bold;
  border-radius:6px;
  text-decoration:none;
  color:white;
  background:#ef4444;
  font-size:13px;
}

.header-right a:hover { background:#dc2626; }

/* LAYOUT */
.container {
  max-width:700px;
  margin:30px auto;
  padding:0 15px;
}

.card {
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
}

label {
  color:#38bdf8;
  font-size:13px;
}

/* INPUT */
input, textarea, select {
  width:100%;
  padding:10px;
  margin:6px 0 12px 0;
  border-radius:6px;
  border:none;
  font-size:14px;
}

textarea {
  height:100px;
  resize:none;
}

/* BUTTON */
button {
  width:100%;
  padding:10px;
  background:#38bdf8;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

button:hover {
  background:#0ea5e5;
}

/* STATUS */
small {
  display:block;
  margin-top:10px;
  color:#94a3b8;
  min-height:20px;
}

/* LIST WORLD */
.world-item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0f172a;
  padding:10px;
  margin-top:8px;
  border-radius:6px;
}

.world-item span {
  font-size:14px;
}

.actions button {
  width:auto;
  padding:5px 8px;
  font-size:12px;
  margin-left:5px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <a href="dashboard.html">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png">
    </a>
  </div>

  <div class="header-right">
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</div>

<!-- CONTENT -->
<div class="container">

  <!-- FORM -->
  <div class="card">
    <h3 style="color:#38bdf8;">List World</h3>

    <label>Name</label>
    <input type="text" id="name">

    <label>Link Gambar (1280x798)</label>
    <input type="text" id="image">

    <label>Deskripsi</label>
    <textarea id="desc"></textarea>

    <label>Status</label>
    <select id="status">
      <option value="READY">READY</option>
      <option value="SOLD">SOLD</option>
    </select>

    <button id="addBtn">~~~~~ TAMBAH WORLD ~~~~~</button>
    <small id="statusMsg"></small>
  </div>

  <!-- LIST -->
  <div class="card">
    <h3 style="color:#38bdf8;">Daftar World</h3>
    <div id="listWorld"></div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzU0WG8W524Vn6LpnbRjhZIrc19Xvle31Os3LskY2gqkBEmQ_CHj44q6NXtJQagbhmTGA/exec";

let worlds = [];

/* STATUS */
function showMsg(msg, ok=true){
  const el = document.getElementById("statusMsg");
  el.textContent = msg;
  el.style.color = ok ? "#38bdf8" : "#ef4444";
  setTimeout(()=>el.textContent="",3000);
}

/* LOAD WORLD */
async function loadWorld(){
  const res = await fetch(SCRIPT_URL + "?action=world");
  worlds = await res.json();
  renderWorld();
}

/* RENDER */
function renderWorld(){
  const el = document.getElementById("listWorld");
  el.innerHTML = "";

  if(worlds.length === 0){
    el.innerHTML = "<small>Belum ada data</small>";
    return;
  }

  worlds.forEach((w,i)=>{
    el.innerHTML += `
    <div class="world-item">
      <span>${i+1}. ${w.name} (${w.status})</span>
      <div class="actions">
        <button onclick="editStatus(${i})">EDIT</button>
        <button onclick="deleteWorld(${i})">DEL</button>
      </div>
    </div>
    `;
  });
}

/* ADD WORLD */
document.getElementById("addBtn").addEventListener("click", async ()=>{

  const data = {
    action:"add_world",
    name: document.getElementById("name").value,
    image: document.getElementById("image").value,
    desc: document.getElementById("desc").value,
    status: document.getElementById("status").value
  };

  if(!data.name || !data.image || !data.desc){
    showMsg("❌ Semua field harus diisi!", false);
    return;
  }

  await fetch(SCRIPT_URL,{
    method:"POST",
    body: JSON.stringify(data)
  });

  showMsg("✅ World berhasil ditambahkan!");
  loadWorld();

  document.getElementById("name").value="";
  document.getElementById("image").value="";
  document.getElementById("desc").value="";
});

/* EDIT STATUS */
function editStatus(i){
  let newStatus = prompt("Ubah status: READY / SOLD", worlds[i].status);

  if(newStatus !== "READY" && newStatus !== "SOLD"){
    showMsg("❌ Hanya READY / SOLD", false);
    return;
  }

  fetch(SCRIPT_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"edit_world",
      id: worlds[i].id,
      status: newStatus
    })
  });

  showMsg("✅ Status diupdate!");
  setTimeout(loadWorld,500);
}

/* DELETE */
function deleteWorld(i){
  if(!confirm("Yakin hapus world ini?")) return;

  fetch(SCRIPT_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"delete_world",
      id: worlds[i].id
    })
  });

  showMsg("🗑 World dihapus!");
  setTimeout(loadWorld,500);
}

/* LOGOUT */
document.getElementById("logoutBtn").addEventListener("click",(e)=>{
  e.preventDefault();
  localStorage.removeItem("admin_login");
  window.location.href="login.html";
});

loadWorld();
</script>

</body>
</html>
