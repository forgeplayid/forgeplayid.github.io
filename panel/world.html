<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Admin</title>
<style>
body { font-family: Arial; background:#020617; color:white; margin:0; }
.header { display:flex; justify-content:space-between; align-items:center; padding:15px 40px; background:#0f172a; border-bottom:1px solid #1e293b; }
.logo img { height:40px; }
.header-right a { padding:6px 14px; background:#ef4444; color:white; text-decoration:none; border-radius:6px; font-weight:bold; }
.layout { display:flex; min-height:100vh; }
.sidebar { width:180px; background:#0f172a; border-right:1px solid #1e293b; padding:10px; }
.menu { display:block; padding:10px; margin-bottom:8px; background:#1e293b; color:white; text-decoration:none; border-radius:6px; font-size:13px; }
.menu:hover { background:#38bdf8; color:#020617; }
.content { flex:1; padding:20px; }
.card { background:#1e293b; padding:20px; border-radius:10px; max-width:700px; }
.label { color:#38bdf8; font-size:13px; margin-top:10px; margin-bottom:4px; display:block; }
input, textarea, select { width:100%; padding:10px; border:none; border-radius:6px; margin-bottom:8px; font-size:14px; }
button { width:100%; padding:10px; background:#38bdf8; border:none; border-radius:6px; font-weight:bold; cursor:pointer; }
button:hover { background:#0ea5e5; }
small { display:block; margin-top:10px; color:#94a3b8; min-height:18px; }
.world-item { background:#0f172a; padding:10px; margin-top:10px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; }
.status-ready { color:#22c55e; font-weight:bold; }
.status-sold { color:#ef4444; font-weight:bold; }
.action-btn { padding:5px 8px; font-size:12px; border:none; border-radius:5px; cursor:pointer; }
.edit { background:#22c55e; color:white; }
.del { background:#ef4444; color:white; }
.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:none; justify-content:center; align-items:center; z-index:999; }
.modal-box { background:#1e293b; padding:20px; border-radius:10px; width:280px; text-align:center; transform: scale(0.8); animation:pop 0.2s ease forwards; }
.modal-box h3 { color:#38bdf8; margin-bottom:15px; }
.modal-btn { width:100%; padding:10px; margin:5px 0; border:none; border-radius:6px; font-weight:bold; cursor:pointer; }
.btn-ready { background:#22c55e; color:white; }
.btn-sold { background:#f8fafc; color:#020617; }
.btn-cancel { background:#ef4444; color:white; }
@keyframes pop { to { transform: scale(1); } }
</style>
</head>
<body>

<div class="header">
  <div class="logo"><a href="dashboard.html"><img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png"></a></div>
  <div class="header-right"><a href="#" id="logoutBtn">Log Out</a></div>
</div>

<div class="layout">
  <div class="sidebar">
    <a class="menu" href="dashboard.html">Dashboard</a>
    <a class="menu" href="price.html">List Harga</a>
    <a class="menu" href="world.html">List World</a>
  </div>

  <div class="content">
    <div class="card">
      <h2 style="color:#38bdf8;">LIST WORLD</h2>

      <label class="label">Name</label><input id="name">
      <label class="label">Link Gambar (1280x798)</label><input id="image">
      <label class="label">Deskripsi</label><textarea id="desc" rows="4"></textarea>
      <label class="label">Status</label>
      <select id="status"><option value="READY">READY</option><option value="SOLD">SOLD</option></select>

      <button id="addBtn" onclick="addWorld()">~~~~~ TAMBAH WORLD ~~~~~</button>
      <small id="msg"></small>

      <hr style="margin:20px 0; border:1px solid #0f293b">
      <div id="list"></div>
    </div>
  </div>
</div>

<!-- MODAL EDIT STATUS -->
<div class="modal-overlay" id="modalEdit">
  <div class="modal-box">
    <h3>Ubah Status</h3>
    <button class="modal-btn btn-ready" onclick="setStatus('READY')">READY</button>
    <button class="modal-btn btn-sold" onclick="setStatus('SOLD')">SOLD</button>
    <button class="modal-btn btn-cancel" onclick="closeEdit()">BATAL</button>
  </div>
</div>

<!-- MODAL DELETE -->
<div class="modal-overlay" id="modalDelete">
  <div class="modal-box">
    <h3>Yakin ingin menghapus world?</h3>
    <button class="modal-btn btn-ready" onclick="confirmDelete()">✅ Hapus</button>
    <button class="modal-btn btn-cancel" onclick="closeDelete()">❌ Batal</button>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeNnRvtTbuacVFi1vX3fy1HvpKeEZgfJXKBGoh_13njwmY2y4hbR7E-WgsLhgBDr5YBA/exec";
let currentEditId = null;
let currentDeleteId = null;
const msg = document.getElementById("msg");
const addBtn = document.getElementById("addBtn");

// Load list world
async function loadWorld(){
  try{
    const res = await fetch(SCRIPT_URL);
    if(!res.ok) throw new Error("Network error "+res.status);
    const data = await res.json();
    const list = document.getElementById("list");
    list.innerHTML = "";
    data.forEach((item,i)=>{
      const html = document.createElement("div");
      html.className = "world-item";
      html.innerHTML = `<div><b>${item.name}</b><br><small class="${item.status==='READY'?'status-ready':'status-sold'}">${item.status}</small></div>
      <div>
        <button class="action-btn edit" onclick="openEdit(${i})">EDIT</button>
        <button class="action-btn del" onclick="openDelete(${i})">DEL</button>
      </div>`;
      list.appendChild(html);
    });
  }catch(e){
    console.error("LoadWorld error:", e);
    msg.style.color="#ef4444";
    msg.innerText="❌ Gagal load daftar: "+e.message;
  }
}

// Add World
async function addWorld(){
  addBtn.disabled=true;
  const originalText = addBtn.innerText;
  addBtn.innerText="Loading...";

  const body = {
    action:"add_world",
    name:name.value.trim(),
    image:image.value.trim(),
    desc:desc.value.trim(),
    status:status.value.trim()
  };

  console.log("Payload:", JSON.stringify(body));

  try{
    const res = await fetch(SCRIPT_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify(body)
    });
    if(!res.ok) throw new Error("Network error "+res.status);
    const result = await res.json();
    msg.style.color = result.status==="success"?"#22c55e":"#ef4444";
    msg.innerText = result.status==="success"?"✅ World berhasil ditambahkan":"❌ Gagal: "+(result.message||"");
    loadWorld();
  }catch(e){
    console.error("Fetch error:", e);
    msg.style.color="#ef4444";
    msg.innerText="❌ Error koneksi: "+e.message;
  }

  addBtn.disabled=false;
  addBtn.innerText=originalText;
  setTimeout(()=>{msg.innerText="";},5000);
}

// Modal Edit / Delete
function openEdit(id){ currentEditId=id; modalEdit.style.display="flex"; }
function closeEdit(){ modalEdit.style.display="none"; currentEditId=null; }
function setStatus(status){ fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"edit_world",id:currentEditId,status})}).then(()=>{closeEdit();loadWorld();}); }

function openDelete(id){ currentDeleteId=id; modalDelete.style.display="flex"; }
function closeDelete(){ modalDelete.style.display="none"; currentDeleteId=null; }
function confirmDelete(){ fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"delete_world",id:currentDeleteId})}).then(()=>{closeDelete();loadWorld();}); }

// Logout
logoutBtn.onclick=(e)=>{e.preventDefault(); localStorage.removeItem("admin_login"); window.location.href="login.html";}

window.onload=loadWorld;
</script>
</body>
</html>
