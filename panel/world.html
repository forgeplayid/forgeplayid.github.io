<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://uniplay.id/cdn/fb64-pic2d7fab3824dd00bb3c05f0002b466e6c1762906411.png">
<title>World Admin</title>

<style>
body { font-family: Arial; background:#020617; color:white; margin:0; }
* { box-sizing:border-box; }

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;
}

.logo img { height:40px; }

.header-right a {
  padding:6px 14px;
  background:#ef4444;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

.layout { display:flex; min-height:100vh; }

.sidebar {
  width:180px;
  background:#0f172a;
  border-right:1px solid #1e293b;
  padding:10px;
  flex-shrink:0;
}

.menu {
  display:block;
  padding:10px;
  margin-bottom:8px;
  background:#1e293b;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-size:13px;
}

.menu:hover { background:#38bdf8; color:#020617; }

.content { flex:1; padding:20px; }

.card {
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  max-width:820px;
}

.label {
  color:#38bdf8;
  font-size:13px;
  margin-top:10px;
  margin-bottom:4px;
  display:block;
}

input, textarea, select {
  width:100%;
  padding:10px;
  border:none;
  border-radius:6px;
  margin-bottom:8px;
  font-size:14px;
  background:white;
  color:black;
}

textarea {
  resize: vertical;
}

button {
  width:100%;
  padding:10px;
  background:#38bdf8;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  color:#020617;
}

button:hover { background:#0ea5e5; }

button.secondary {
  background:#475569;
  color:white;
}

button.secondary:hover {
  background:#64748b;
}

small {
  display:block;
  margin-top:10px;
  color:#94a3b8;
  min-height:18px;
}

.world-item {
  background:#0f172a;
  border:1px solid #23324a;
  border-radius:8px;
  padding:12px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.world-left {
  flex:1;
  min-width:0;
}

.world-name {
  font-size:15px;
  font-weight:bold;
  margin-bottom:6px;
  word-break:break-word;
}

.world-desc {
  font-size:13px;
  color:#94a3b8;
  line-height:1.5;
  margin-bottom:6px;
  word-break:break-word;
  white-space:pre-line;
}

.world-meta {
  font-size:13px;
}

.status-ready { color:#22c55e; font-weight:bold; }
.status-sold { color:#ef4444; font-weight:bold; }

.world-actions {
  display:flex;
  gap:8px;
  flex-shrink:0;
}

.btn-mini {
  width:auto;
  padding:8px 12px;
  font-size:12px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.btn-edit {
  background:#38bdf8;
  color:#020617;
}

.btn-edit:hover {
  background:#0ea5e9;
}

.btn-del {
  background:#ef4444;
  color:white;
}

.btn-del:hover {
  background:#dc2626;
}

.action-row {
  display:flex;
  gap:10px;
}

.action-row button {
  flex:1;
}

/* POPUP */
.modal {
  position:fixed;
  inset:0;
  background:rgba(2,6,23,0.72);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:0.25s ease;
  z-index:9999;
  padding:16px;
}

.modal.show {
  opacity:1;
  pointer-events:auto;
}

.modal-box {
  width:100%;
  max-width:500px;
  background:#111827;
  border:1px solid #334155;
  border-radius:14px;
  padding:22px;
  transform:translateY(20px) scale(0.96);
  transition:0.25s ease;
  box-shadow:0 20px 50px rgba(0,0,0,0.45);
  max-height: calc(100vh - 32px);
  overflow-y: auto;
}

.modal.show .modal-box {
  transform:translateY(0) scale(1);
}

.modal-title {
  margin:0 0 10px 0;
  font-size:22px;
  color:white;
}

.modal-text {
  margin:0;
  color:#cbd5e1;
  line-height:1.6;
  font-size:14px;
}

.modal-actions {
  display:flex;
  gap:10px;
  margin-top:18px;
}

.modal-actions button {
  margin:0;
}

.modal-danger {
  background:#ef4444;
  color:#fff;
}

.modal-danger:hover {
  background:#dc2626;
}

.modal-icon {
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  margin-bottom:14px;
  font-size:22px;
  background:rgba(56,189,248,0.12);
  border:1px solid rgba(56,189,248,0.25);
}

.modal-icon.danger {
  background:rgba(239,68,68,0.12);
  border:1px solid rgba(239,68,68,0.25);
}

.edit-form {
  margin-top: 10px;
}

.edit-form .label {
  margin-top: 12px;
}

.modal-message {
  margin-top: 10px;
  min-height: 18px;
  font-size: 13px;
  color: #94a3b8;
}

@media(max-width:768px){
  .world-item {
    flex-direction:column;
  }

  .world-actions {
    width:100%;
  }

  .btn-mini {
    flex:1;
  }
}
</style>
</head>

<body>

<script>
if (localStorage.getItem("admin_login") !== "true") {
  window.location.replace("https://forgeplayid.github.io/panel/login.html");
}
</script>

<div class="header">
  <div class="logo">
    <a href="dashboard.html">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="ForgePlayID">
    </a>
  </div>

  <div class="header-right">
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</div>

<div class="layout">

  <div class="sidebar">
    <a class="menu" href="dashboard.html">Dashboard</a>
    <a class="menu" href="price.html">List Harga</a>
    <a class="menu" href="world.html">List World</a>
    <a class="menu" href="info.html">Info</a>
    <a class="menu" href="data.html">Data</a>
  </div>

  <div class="content">
    <div class="card">
      <h2 style="color:#38bdf8;">LIST WORLD</h2>

      <label class="label">Name</label>
      <input id="name">

      <label class="label">Link Gambar (1280x798)</label>
      <input id="image">

      <label class="label">Deskripsi</label>
      <textarea id="desc" rows="4"></textarea>

      <label class="label">Status</label>
      <select id="status">
        <option value="READY">READY</option>
        <option value="SOLD">SOLD</option>
      </select>

      <div class="action-row">
        <button id="addBtn">~~~~~ TAMBAH WORLD ~~~~~</button>
      </div>

      <small id="msg"></small>

      <hr style="margin:20px 0; border:1px solid #0f293b">

      <div id="list"></div>
    </div>
  </div>

</div>

<!-- MODAL EDIT -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <div class="modal-icon">✏️</div>
    <h3 class="modal-title">Edit World</h3>
    <p class="modal-text">Ubah data world di bawah ini lalu simpan.</p>

    <div class="edit-form">
      <label class="label">Name</label>
      <input id="editName">

      <label class="label">Link Gambar (1280x798)</label>
      <input id="editImage">

      <label class="label">Deskripsi</label>
      <textarea id="editDesc" rows="5"></textarea>

      <label class="label">Status</label>
      <select id="editStatus">
        <option value="READY">READY</option>
        <option value="SOLD">SOLD</option>
      </select>

      <div class="modal-message" id="editMsg"></div>

      <div class="modal-actions">
        <button class="secondary" onclick="closeModal('editModal')">Batal</button>
        <button id="saveEditBtn">Simpan Perubahan</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DELETE -->
<div class="modal" id="deleteModal">
  <div class="modal-box">
    <div class="modal-icon danger">🗑️</div>
    <h3 class="modal-title">Hapus World?</h3>
    <p class="modal-text" id="deleteModalText">Apakah kamu yakin ingin menghapus world ini?</p>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal('deleteModal')">Batal</button>
      <button class="modal-danger" id="confirmDeleteBtn">Ya, Hapus</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyP8YiC0cxjdVM_Fm94W342_R-yUZGE4S1FJYPwo4SO8VhBkksIIZkzMvGbz40i99NGfg/exec";

const msg = document.getElementById("msg");
const addBtn = document.getElementById("addBtn");
const listEl = document.getElementById("list");

const nameEl = document.getElementById("name");
const imageEl = document.getElementById("image");
const descEl = document.getElementById("desc");
const statusEl = document.getElementById("status");

const editNameEl = document.getElementById("editName");
const editImageEl = document.getElementById("editImage");
const editDescEl = document.getElementById("editDesc");
const editStatusEl = document.getElementById("editStatus");
const editMsgEl = document.getElementById("editMsg");
const saveEditBtn = document.getElementById("saveEditBtn");

let editId = null;
let deleteId = null;

function showMsg(text, color="#94a3b8"){
  msg.style.color = color;
  msg.innerText = text;
}

function showEditMsg(text, color="#94a3b8"){
  editMsgEl.style.color = color;
  editMsgEl.innerText = text;
}

function clearForm(){
  nameEl.value = "";
  imageEl.value = "";
  descEl.value = "";
  statusEl.value = "READY";
}

function openModal(id){
  document.getElementById(id).classList.add("show");
}

function closeModal(id){
  document.getElementById(id).classList.remove("show");
  if(id === "editModal"){
    showEditMsg("");
    editId = null;
  }
}

window.closeModal = closeModal;

function shortText(text, maxLength){
  if (text.length <= maxLength) return text;
  return text.slice(0, maxLength) + "...";
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(str){
  return escapeHtml(str);
}

async function loadWorld(){
  try{
    showMsg("Loading daftar world...", "#94a3b8");

    const res = await fetch(SCRIPT_URL + "?action=list_world");
    const result = await res.json();

    listEl.innerHTML = "";

    if (!result || result.status !== "success") {
      showMsg("❌ Gagal load daftar: " + (result?.message || "Response tidak valid"), "#ef4444");
      return;
    }

    const data = result.data || [];

    if (!data.length) {
      listEl.innerHTML = `
        <div class="world-item">
          <div class="world-left">
            <div class="world-name">Belum ada data world</div>
            <div class="world-desc">Tambahkan world pertama kamu dari form di atas.</div>
          </div>
        </div>
      `;
      showMsg("");
      return;
    }

    data.forEach((item, index) => {
      const status = String(item.status || "").toUpperCase();
      const statusClass = status === "READY" ? "status-ready" : "status-sold";

      const html = document.createElement("div");
      html.className = "world-item";
      html.innerHTML = `
        <div class="world-left">
          <div class="world-name">${index + 1}. ${escapeHtml(item.name || "-")}</div>
          <div class="world-desc">${escapeHtml(shortText(item.desc || "-", 100))}</div>
          <div class="world-meta">
            Status: <span class="${statusClass}">${escapeHtml(status)}</span>
          </div>
        </div>

        <div class="world-actions">
          <button class="btn-mini btn-edit" data-id="${escapeAttr(item.id)}">EDIT</button>
          <button class="btn-mini btn-del" data-id="${escapeAttr(item.id)}" data-name="${escapeAttr(item.name || "")}">DEL</button>
        </div>
      `;
      listEl.appendChild(html);
    });

    bindListButtons();
    showMsg("");

  } catch(e){
    showMsg("❌ Gagal load daftar: " + e.message, "#ef4444");
  }
}

function bindListButtons(){
  document.querySelectorAll(".btn-edit").forEach(btn => {
    btn.onclick = async function(){
      const id = this.getAttribute("data-id");
      await startEdit(id);
    };
  });

  document.querySelectorAll(".btn-del").forEach(btn => {
    btn.onclick = function(){
      const id = this.getAttribute("data-id");
      const name = this.getAttribute("data-name");
      askDelete(id, name);
    };
  });
}

async function addWorld(){
  const name = nameEl.value.trim();
  const image = imageEl.value.trim();
  const desc = descEl.value.trim();
  const status = statusEl.value.trim().toUpperCase();

  if(!name || !image || !desc || !status){
    showMsg("❌ Input tidak lengkap", "#ef4444");
    return;
  }

  const originalText = addBtn.innerText;
  addBtn.disabled = true;
  addBtn.innerText = "Loading...";

  try{
    const res = await fetch(SCRIPT_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({
        action:"add_world",
        name,
        image,
        desc,
        status
      })
    });

    const result = await res.json();

    if(result.status === "success"){
      showMsg("✅ World berhasil ditambahkan", "#22c55e");
      clearForm();
      await loadWorld();
    } else {
      showMsg("❌ Gagal: " + (result.message || "Unknown error"), "#ef4444");
    }
  } catch(e){
    showMsg("❌ Error koneksi: " + e.message, "#ef4444");
  }

  addBtn.disabled = false;
  addBtn.innerText = originalText;
}

async function startEdit(id){
  try{
    const res = await fetch(SCRIPT_URL + "?action=get_world&id=" + encodeURIComponent(id));
    const result = await res.json();

    if(result.status !== "success"){
      showMsg("❌ Gagal ambil data edit: " + (result.message || ""), "#ef4444");
      return;
    }

    const item = result.data;
    editId = item.id;

    editNameEl.value = item.name || "";
    editImageEl.value = item.image || "";
    editDescEl.value = item.desc || "";
    editStatusEl.value = (item.status || "READY").toUpperCase();
    showEditMsg("");

    openModal("editModal");
  } catch(e){
    showMsg("❌ Error edit: " + e.message, "#ef4444");
  }
}

async function saveEdit(){
  if(!editId){
    showEditMsg("❌ ID world tidak ditemukan", "#ef4444");
    return;
  }

  const name = editNameEl.value.trim();
  const image = editImageEl.value.trim();
  const desc = editDescEl.value.trim();
  const status = editStatusEl.value.trim().toUpperCase();

  if(!name || !image || !desc || !status){
    showEditMsg("❌ Input edit tidak lengkap", "#ef4444");
    return;
  }

  const originalText = saveEditBtn.innerText;
  saveEditBtn.disabled = true;
  saveEditBtn.innerText = "Menyimpan...";

  try{
    const res = await fetch(SCRIPT_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({
        action:"edit_world",
        id: editId,
        name,
        image,
        desc,
        status
      })
    });

    const result = await res.json();

    if(result.status === "success"){
      showEditMsg("✅ Perubahan berhasil disimpan", "#22c55e");
      await loadWorld();

      setTimeout(() => {
        closeModal("editModal");
      }, 500);
    } else {
      showEditMsg("❌ Gagal update: " + (result.message || ""), "#ef4444");
    }
  } catch(e){
    showEditMsg("❌ Error update: " + e.message, "#ef4444");
  }

  saveEditBtn.disabled = false;
  saveEditBtn.innerText = originalText;
}

function askDelete(id, name){
  deleteId = id;
  document.getElementById("deleteModalText").innerText =
    `Apakah kamu yakin ingin menghapus world "${name}"? Data yang sudah dihapus tidak bisa dikembalikan.`;
  openModal("deleteModal");
}

document.getElementById("confirmDeleteBtn").onclick = async function(){
  if(!deleteId) return;

  const btn = this;
  const original = btn.innerText;
  btn.disabled = true;
  btn.innerText = "Menghapus...";

  try{
    const res = await fetch(SCRIPT_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({
        action:"delete_world",
        id:deleteId
      })
    });

    const result = await res.json();

    if(result.status === "success"){
      closeModal("deleteModal");
      showMsg("✅ World berhasil dihapus", "#22c55e");
      deleteId = null;
      await loadWorld();
    } else {
      showMsg("❌ Gagal hapus: " + (result.message || ""), "#ef4444");
    }
  } catch(e){
    showMsg("❌ Error hapus: " + e.message, "#ef4444");
  }

  btn.disabled = false;
  btn.innerText = original;
};

addBtn.onclick = addWorld;
saveEditBtn.onclick = saveEdit;

document.getElementById("logoutBtn").onclick = e => {
  e.preventDefault();
  localStorage.removeItem("admin_login");
  window.location.href = "https://forgeplayid.github.io/panel/login.html";
};

document.querySelectorAll(".modal").forEach(modal => {
  modal.addEventListener("click", function(e){
    if (e.target === modal) {
      modal.classList.remove("show");
      if (modal.id === "editModal") {
        showEditMsg("");
        editId = null;
      }
    }
  });
});

window.onload = async () => {
  clearForm();
  await loadWorld();
};
</script>

</body>
</html>
