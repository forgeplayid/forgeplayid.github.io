<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://uniplay.id/cdn/fb64-pic2d7fab3824dd00bb3c05f0002b466e6c1762906411.png">
<title>Admin Info Panel</title>

<style>
body {
  font-family: Arial;
  background:#020617;
  color:white;
  margin:0;
}

* {
  box-sizing: border-box;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;
}

.logo img { height:40px; }

.header-right a {
  padding:6px 14px;
  background:#ef4444;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

.layout {
  display:flex;
  min-height:100vh;
}

.sidebar {
  width:180px;
  background:#0f172a;
  border-right:1px solid #1e293b;
  padding:10px;
  flex-shrink: 0;
}

.menu {
  display:block;
  padding:10px;
  margin-bottom:8px;
  background:#1e293b;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-size:13px;
}

.menu:hover {
  background:#38bdf8;
  color:#020617;
}

.content {
  flex:1;
  padding:22px 28px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.main-wrap {
  width:100%;
  max-width:1020px;
}

.card {
  width:100%;
  background:#1e293b;
  padding:24px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.22);
  margin-bottom:18px;
}

.card-header {
  margin-bottom:18px;
}

.card-header h2 {
  margin:0 0 8px 0;
  color:#38bdf8;
  font-size:18px;
}

.card-header p {
  margin:0;
  color:#94a3b8;
  font-size:13px;
  line-height:1.5;
}

.label {
  color:#38bdf8;
  font-size:13px;
  margin-top:10px;
  margin-bottom:6px;
  display:block;
  font-weight:600;
}

.field-wrap {
  max-width:680px;
}

textarea,
input {
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  font-size:14px;
  background:white;
  color:black;
}

textarea {
  min-height:160px;
  resize: vertical;
  line-height:1.5;
}

.button-wrap {
  max-width:680px;
  margin-top:8px;
}

button {
  width:100%;
  padding:11px 12px;
  background:#38bdf8;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  color:#020617;
}

button:hover {
  background:#0ea5e5;
}

button.secondary {
  background:#475569;
  color:white;
}

button.secondary:hover {
  background:#64748b;
}

button.danger {
  background:#ef4444;
  color:white;
}

button.danger:hover {
  background:#dc2626;
}

.status-wrap {
  max-width:680px;
}

small {
  display:block;
  margin-top:10px;
  color:#94a3b8;
  min-height:18px;
  font-size:13px;
}

.slider-toolbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.slider-toolbar-left {
  color:#94a3b8;
  font-size:13px;
}

.slider-toolbar-right {
  width:220px;
}

.slider-grid {
  display:grid;
  grid-template-columns: repeat(2, minmax(280px, 1fr));
  gap:16px;
}

.slider-box {
  background:#111827;
  border:1px solid #263449;
  border-radius:12px;
  padding:16px;
}

.slider-box-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.slider-box-head h3 {
  margin:0;
  color:#7dd3fc;
  font-size:15px;
}

.order-badge {
  padding:4px 8px;
  border-radius:999px;
  background:#0f172a;
  border:1px solid #22314a;
  color:#cbd5e1;
  font-size:12px;
  font-weight:700;
}

.slider-preview {
  width:100%;
  aspect-ratio: 16 / 9;
  border-radius:10px;
  overflow:hidden;
  background:#0b1220;
  border:1px solid #22314a;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:12px;
}

.slider-preview img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.slider-preview span {
  color:#64748b;
  font-size:12px;
  text-align:center;
  padding:10px;
}

.slider-actions {
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:8px;
  margin-top:12px;
}

.empty-slider {
  padding:30px 18px;
  text-align:center;
  color:#94a3b8;
  border:1px dashed #334155;
  border-radius:12px;
  background:#111827;
}

@media(max-width:1100px){
  .slider-grid {
    grid-template-columns: 1fr;
  }
}

@media(max-width:768px){
  .header {
    padding:15px 20px;
  }

  .content {
    padding:16px;
  }

  .field-wrap,
  .button-wrap,
  .status-wrap {
    max-width:100%;
  }

  .slider-toolbar-right {
    width:100%;
  }
}
</style>
</head>

<body>

<script>
if (localStorage.getItem("admin_login") !== "true") {
  window.location.replace("https://forgeplayid.github.io/panel/login.html");
}
</script>

<div class="header">
  <div class="logo">
    <a href="dashboard.html">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="ForgePlayID">
    </a>
  </div>

  <div class="header-right">
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</div>

<div class="layout">

  <div class="sidebar">
    <a class="menu" href="dashboard.html">Dashboard</a>
    <a class="menu" href="price.html">List Harga</a>
    <a class="menu" href="world.html">List World</a>
    <a class="menu" href="info.html">Info</a>
    <a class="menu" href="data.html">Data</a>
  </div>

  <div class="content">
    <div class="main-wrap">

      <!-- RUNNING INFO -->
      <div class="card">
        <div class="card-header">
          <h2>EDIT RUNNING INFO</h2>
          <p>Kelola teks pengumuman yang tampil berjalan di website.</p>
        </div>

        <div class="field-wrap">
          <label class="label">Pengumuman</label>
          <textarea id="infoInput" placeholder="🔥 Promo hari ini ⚡ Stock aman 💎"></textarea>
        </div>

        <div class="button-wrap">
          <button onclick="updateInfo()">UPDATE INFO</button>
        </div>

        <div class="status-wrap">
          <small id="infoMsg"></small>
        </div>
      </div>

      <!-- SLIDER MANAGER -->
      <div class="card">
        <div class="card-header">
          <h2>SLIDER MANAGER</h2>
          <p>Tambah, update, hapus, dan susun urutan slider website.</p>
        </div>

        <div class="slider-toolbar">
          <div class="slider-toolbar-left">
            Urutan slider mengikuti posisi card dari atas ke bawah.
          </div>
          <div class="slider-toolbar-right">
            <button onclick="addSlider()">+ TAMBAH SLIDER</button>
          </div>
        </div>

        <div id="sliderList" class="slider-grid"></div>

        <div class="status-wrap" style="max-width:none;">
          <small id="sliderMsg"></small>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
const INFO_URL = "https://script.google.com/macros/s/AKfycbyYY0pt19KzeSFfMf3udOpSBJxvQ1cR6MUtT3bmKUVQugW5KyO18MNem5INQRdsUZVVSw/exec";
const SLIDER_URL = "https://script.google.com/macros/s/AKfycbzD8L_MBr3Ph_wHEBU5TxNKGLTPdne_Wf0h4hhCCbd9Hy0_1_gNJoB_46B0R-KMvT-tDA/exec";

const infoMsg = document.getElementById("infoMsg");
const sliderMsg = document.getElementById("sliderMsg");
const sliderList = document.getElementById("sliderList");

/* ================= INFO ================= */
async function loadInfo() {
  try {
    const res = await fetch(INFO_URL + "?t=" + Date.now());
    const data = await res.json();
    document.getElementById("infoInput").value = data.info || "";
  } catch (e) {
    console.log("LOAD INFO ERROR:", e);
    infoMsg.style.color = "#ef4444";
    infoMsg.innerText = "❌ gagal load info";
  }
}

async function updateInfo() {
  const val = document.getElementById("infoInput").value.trim();

  if (!val) {
    infoMsg.style.color = "#ef4444";
    infoMsg.innerText = "❌ tidak boleh kosong";
    return;
  }

  try {
    const res = await fetch(INFO_URL, {
      method: "POST",
      body: new URLSearchParams({ info: val })
    });

    const data = await res.json();
    console.log("POST INFO RESULT:", data);

    infoMsg.style.color = "#22c55e";
    infoMsg.innerText = "✅ berhasil update info";
    loadInfo();
  } catch (e) {
    console.log(e);
    infoMsg.style.color = "#ef4444";
    infoMsg.innerText = "❌ gagal koneksi";
  }

  setTimeout(() => infoMsg.innerText = "", 4000);
}

/* ================= SLIDER ================= */
function showSliderMsg(text, ok = true){
  sliderMsg.style.color = ok ? "#22c55e" : "#ef4444";
  sliderMsg.innerText = (ok ? "✅ " : "❌ ") + text;
  setTimeout(() => { sliderMsg.innerText = ""; }, 4000);
}

function escapeHtml(str){
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function createSliderCard(slider, index, total){
  const image = slider.image || "";
  const link = slider.link || "";
  const key = slider.key || "";

  return `
    <div class="slider-box" data-key="${escapeHtml(key)}">
      <div class="slider-box-head">
        <h3>Slider ${index + 1}</h3>
        <span class="order-badge">Urutan ${index + 1}</span>
      </div>

      <div class="slider-preview">
        ${image
          ? `<img src="${escapeHtml(image)}" style="display:block;" alt="Preview Slider ${index + 1}">`
          : `<span>Preview gambar slider ${index + 1}</span>`
        }
      </div>

      <label class="label">Link Gambar</label>
      <input class="slider-image" value="${escapeHtml(image)}" placeholder="https://...">

      <label class="label">Link Tujuan</label>
      <input class="slider-link" value="${escapeHtml(link)}" placeholder="https://...">

      <div class="slider-actions">
        <button onclick="updateSingleSlider('${escapeHtml(key)}')">UPDATE</button>
        <button class="danger" onclick="deleteSlider('${escapeHtml(key)}')">HAPUS</button>
        <button class="secondary" onclick="moveUp('${escapeHtml(key)}')" ${index === 0 ? "disabled" : ""}>NAIK</button>
        <button class="secondary" onclick="moveDown('${escapeHtml(key)}')" ${index === total - 1 ? "disabled" : ""}>TURUN</button>
      </div>
    </div>
  `;
}

async function loadSliders() {
  try {
    const res = await fetch(SLIDER_URL + "?action=list_sliders");
    const result = await res.json();

    if (!result || result.status !== "success" || !Array.isArray(result.data)) {
      sliderList.innerHTML = `<div class="empty-slider">Gagal load slider.</div>`;
      return;
    }

    const sliders = result.data;

    if (!sliders.length) {
      sliderList.innerHTML = `<div class="empty-slider">Belum ada slider. Klik "Tambah Slider" untuk mulai.</div>`;
      return;
    }

    sliderList.innerHTML = sliders.map((slider, index) => createSliderCard(slider, index, sliders.length)).join("");

    bindPreviewInputs();
  } catch (e) {
    console.log("LOAD SLIDER ERROR:", e);
    sliderList.innerHTML = `<div class="empty-slider">Gagal load slider.</div>`;
  }
}

function bindPreviewInputs(){
  document.querySelectorAll(".slider-box").forEach(box => {
    const imageInput = box.querySelector(".slider-image");
    const preview = box.querySelector(".slider-preview");

    imageInput.addEventListener("input", () => {
      const val = imageInput.value.trim();

      if (val) {
        preview.innerHTML = `<img src="${escapeHtml(val)}" style="display:block;" alt="Preview Slider">`;
      } else {
        preview.innerHTML = `<span>Preview gambar slider</span>`;
      }
    });
  });
}

function getSliderBoxByKey(key){
  return document.querySelector(`.slider-box[data-key="${CSS.escape(key)}"]`);
}

async function updateSingleSlider(key) {
  const box = getSliderBoxByKey(key);
  if (!box) return;

  const image = box.querySelector(".slider-image").value.trim();
  const link = box.querySelector(".slider-link").value.trim();

  try {
    const res = await fetch(SLIDER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "update_slider",
        key,
        image,
        link
      })
    });

    const result = await res.json();

    if (result.status === "success") {
      showSliderMsg("slider berhasil diupdate", true);
      await loadSliders();
    } else {
      showSliderMsg(result.message || "gagal update slider", false);
    }
  } catch (e) {
    console.log("UPDATE SLIDER ERROR:", e);
    showSliderMsg("gagal koneksi slider", false);
  }
}

async function addSlider() {
  try {
    const res = await fetch(SLIDER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "add_slider"
      })
    });

    const result = await res.json();

    if (result.status === "success") {
      showSliderMsg("slider baru berhasil ditambahkan", true);
      await loadSliders();
    } else {
      showSliderMsg(result.message || "gagal tambah slider", false);
    }
  } catch (e) {
    console.log("ADD SLIDER ERROR:", e);
    showSliderMsg("gagal koneksi slider", false);
  }
}

async function deleteSlider(key) {
  if (!confirm("Yakin ingin menghapus slider ini?")) return;

  try {
    const res = await fetch(SLIDER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "delete_slider",
        key
      })
    });

    const result = await res.json();

    if (result.status === "success") {
      showSliderMsg("slider berhasil dihapus", true);
      await loadSliders();
    } else {
      showSliderMsg(result.message || "gagal hapus slider", false);
    }
  } catch (e) {
    console.log("DELETE SLIDER ERROR:", e);
    showSliderMsg("gagal koneksi slider", false);
  }
}

async function moveUp(key) {
  try {
    const res = await fetch(SLIDER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "move_up",
        key
      })
    });

    const result = await res.json();

    if (result.status === "success") {
      await loadSliders();
    } else {
      showSliderMsg(result.message || "gagal pindah urutan", false);
    }
  } catch (e) {
    console.log("MOVE UP ERROR:", e);
    showSliderMsg("gagal koneksi slider", false);
  }
}

async function moveDown(key) {
  try {
    const res = await fetch(SLIDER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "move_down",
        key
      })
    });

    const result = await res.json();

    if (result.status === "success") {
      await loadSliders();
    } else {
      showSliderMsg(result.message || "gagal pindah urutan", false);
    }
  } catch (e) {
    console.log("MOVE DOWN ERROR:", e);
    showSliderMsg("gagal koneksi slider", false);
  }
}

/* ================= LOGOUT ================= */
document.getElementById("logoutBtn").onclick = (e) => {
  e.preventDefault();
  localStorage.removeItem("admin_login");
  window.location.href = "https://forgeplayid.github.io/panel/login.html";
};

window.onload = async () => {
  await loadInfo();
  await loadSliders();
};
</script>

</body>
</html>
