<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://uniplay.id/cdn/fb64-pic2d7fab3824dd00bb3c05f0002b466e6c1762906411.png">
<title>Admin Info Panel</title>

<style>
body {
  font-family: Arial;
  background:#020617;
  color:white;
  margin:0;
}

* {
  box-sizing: border-box;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;
}

.logo img { height:40px; }

.header-right a {
  padding:6px 14px;
  background:#ef4444;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

.layout {
  display:flex;
  min-height:100vh;
}

.sidebar {
  width:180px;
  background:#0f172a;
  border-right:1px solid #1e293b;
  padding:10px;
  flex-shrink: 0;
}

.menu {
  display:block;
  padding:10px;
  margin-bottom:8px;
  background:#1e293b;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-size:13px;
}

.menu:hover {
  background:#38bdf8;
  color:#020617;
}

.content {
  flex:1;
  padding:22px 28px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.main-wrap {
  width:100%;
  max-width:920px;
}

.card {
  width:100%;
  max-width:760px;
  background:#1e293b;
  padding:24px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.22);
}

.card-header {
  margin-bottom:18px;
}

.card-header h2 {
  margin:0 0 8px 0;
  color:#38bdf8;
  font-size:18px;
}

.card-header p {
  margin:0;
  color:#94a3b8;
  font-size:13px;
  line-height:1.5;
}

.label {
  color:#38bdf8;
  font-size:13px;
  margin-top:10px;
  margin-bottom:6px;
  display:block;
  font-weight:600;
}

.field-wrap {
  max-width:640px;
}

textarea {
  width:100%;
  min-height:170px;
  padding:12px;
  border:none;
  border-radius:8px;
  font-size:14px;
  background:white;
  color:black;
  resize: vertical;
  line-height:1.5;
}

.button-wrap {
  max-width:640px;
  margin-top:8px;
}

button {
  width:100%;
  padding:11px 12px;
  background:#38bdf8;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  color:#020617;
}

button:hover {
  background:#0ea5e5;
}

.status-wrap {
  max-width:640px;
}

small {
  display:block;
  margin-top:10px;
  color:#94a3b8;
  min-height:18px;
  font-size:13px;
}

.empty-space {
  height:260px;
}

@media(max-width:768px){
  .header {
    padding:15px 20px;
  }

  .content {
    padding:16px;
  }

  .card {
    max-width:100%;
  }

  .field-wrap,
  .button-wrap,
  .status-wrap {
    max-width:100%;
  }

  .empty-space {
    height:180px;
  }
}
</style>
</head>

<body>

<script>
if (localStorage.getItem("admin_login") !== "true") {
  window.location.replace("https://forgeplayid.github.io/panel/login.html");
}
</script>

<div class="header">
  <div class="logo">
    <a href="dashboard.html">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="ForgePlayID">
    </a>
  </div>

  <div class="header-right">
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</div>

<div class="layout">

  <div class="sidebar">
    <a class="menu" href="dashboard.html">Dashboard</a>
    <a class="menu" href="price.html">List Harga</a>
    <a class="menu" href="world.html">List World</a>
    <a class="menu" href="info.html">Info</a>
    <a class="menu" href="data.html">Data</a>
  </div>

  <div class="content">
    <div class="main-wrap">
      <div class="card">

        <div class="card-header">
          <h2>EDIT RUNNING INFO</h2>
          <p>Kelola teks pengumuman yang tampil berjalan di website.</p>
        </div>

        <div class="field-wrap">
          <label class="label">Pengumuman</label>
          <textarea id="infoInput" placeholder="🔥 Promo hari ini ⚡ Stock aman 💎"></textarea>
        </div>

        <div class="button-wrap">
          <button onclick="updateInfo()">UPDATE INFO</button>
        </div>

        <div class="status-wrap">
          <small id="msg"></small>
        </div>

      </div>

      <div class="empty-space"></div>
    </div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYY0pt19KzeSFfMf3udOpSBJxvQ1cR6MUtT3bmKUVQugW5KyO18MNem5INQRdsUZVVSw/exec";

const msg = document.getElementById("msg");

/* ================= LOAD ================= */
async function loadInfo() {
  try {
    const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
    const data = await res.json();

    document.getElementById("infoInput").value = data.info || "";

  } catch (e) {
    console.log("LOAD ERROR:", e);
    msg.style.color = "#ef4444";
    msg.innerText = "❌ gagal load";
  }
}

/* ================= UPDATE ================= */
async function updateInfo() {

  const val = document.getElementById("infoInput").value.trim();

  if (!val) {
    msg.style.color = "#ef4444";
    msg.innerText = "❌ tidak boleh kosong";
    return;
  }

  try {

    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: new URLSearchParams({
        info: val
      })
    });

    const data = await res.json();
    console.log("POST RESULT:", data);

    msg.style.color = "#22c55e";
    msg.innerText = "✅ berhasil update";

    loadInfo();

  } catch (e) {
    console.log(e);
    msg.style.color = "#ef4444";
    msg.innerText = "❌ gagal koneksi";
  }

  setTimeout(()=>msg.innerText="",4000);
}

/* LOGOUT */
document.getElementById("logoutBtn").onclick = (e)=>{
  e.preventDefault();
  localStorage.removeItem("admin_login");
  window.location.href = "https://forgeplayid.github.io/panel/login.html";
}

window.onload = loadInfo;
</script>

</body>
</html>
