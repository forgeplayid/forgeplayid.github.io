<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body {
  font-family: Arial;
  background: #020617;
  color: white;
  margin: 0;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;
}

.logo img { height:40px; }

.header-right a {
  padding:8px 18px;
  background:#ef4444;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

/* LAYOUT */
.layout { display:flex; }

.sidebar {
  width:180px;
  background:#0f172a;
  border-right:1px solid #1e293b;
  padding:15px 10px;
}

.menu {
  display:block;
  padding:10px;
  margin-bottom:8px;
  background:#1e293b;
  color:white;
  text-decoration:none;
  border-radius:6px;
}

.content { flex:1; padding:30px; }

/* TABLE */
table { width:100%; border-collapse:collapse; }

th, td {
  border:1px solid #1e293b;
  padding:6px;
  text-align:center;
}

td:nth-child(2){
  width:320px; /* 🔥 DESCRIPTION LEBAR */
}

input {
  width:95%;
  background:#334155;
  border:none;
  color:white;
  text-align:center;
}

input.editable {
  background:white;
  color:black;
}

/* STATUS */
.sort-box{
  padding:6px;
  border:1px solid #38bdf8;
  border-radius:8px;
  color:#38bdf8;
  cursor:pointer;
}

.sort-box.sold{
  border-color:#ef4444;
  color:#ef4444;
}

/* ACTION BAR */
.action-bar{
  margin-top:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button {
  padding:8px 12px;
  border:none;
  cursor:pointer;
  margin-right:6px;
  border-radius:5px;
}

#editBtn { background:orange; }
#updateBtn { background:limegreen; display:none; }
#addRow { background:#3b82f6; color:white; }
#removeRow { background:#ef4444; color:white; }

/* CONVERT */
.convert{
  margin-top:20px;
  background:#0f172a;
  padding:15px;
  border-radius:10px;
}

.convert-item{
  margin-top:10px;
}

.convert input{
  width:120px;
  background:white;
  color:black;
}

</style>
</head>

<body>

<div class="header">
  <div class="logo">
    <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png">
  </div>
  <div class="header-right">
    <a href="#">Log Out</a>
  </div>
</div>

<div class="layout">

<div class="sidebar">
  <a href="https://forgeplayid.github.io/panel/dashboard.html" class="menu">Dashboard</a>
    <a href="https://forgeplayid.github.io/panel/price.html" class="menu">List Harga</a>
    <a href="https://forgeplayid.github.io/panel/world.html" class="menu">List World</a>
    <a href="https://forgeplayid.github.io/panel/info.html" class="menu">Info</a>
    <a href="https://forgeplayid.github.io/panel/data.html" class="menu">Data</a>
</div>

<div class="content">

<h2>Admin Untung Rugi</h2>

<table>
<thead>
<tr>
<th>World</th>
<th>Description</th>
<th>BUY</th>
<th>SELL</th>
<th>NEGO</th>
<th>PROFIT</th>
<th>STATUS</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

<tfoot>
<tr>
<td colspan="2">TOTAL</td>
<td id="totalBuy">0</td>
<td id="totalSell">0</td>
<td id="totalNego">0</td>
<td id="totalProfit">0</td>
<td>-</td>
</tr>
</tfoot>
</table>

<!-- ACTION -->
<div class="action-bar">

<div>
<button id="editBtn">EDIT</button>
<button id="updateBtn">UPDATE</button>
<button id="addRow">+</button>
<button id="removeRow">-</button>
</div>

<div>
Format DL/WL: <b id="format">0 DL / 0 WL</b>
</div>

</div>

<!-- CONVERT -->
<div class="convert">
<b>CONVERT :</b>

<div class="convert-item">
<input id="wlInput"> WL = <span id="wlToDl">0</span> DL
</div>

<div class="convert-item">
<input id="dlInput"> DL = <span id="dlToWl">0</span> WL
</div>

<div class="convert-item">
<input id="dlBglInput"> DL = <span id="dlToBgl">0</span> BGL
</div>

<div class="convert-item">
<input id="bglInput"> BGL = <span id="bglToWl">0</span> WL
</div>

</div>

</div>
</div>

<script>
const tbody=document.getElementById("tableBody");
let editMode=false;

/* FORMAT */
function formatNumber(n){
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
}
function parseNumber(v){
  return parseInt((v||"").replace(/\./g,""))||0;
}

/* ROW */
function createRow(){
  const tr=document.createElement("tr");
  tr.innerHTML=`
  <td><input disabled></td>
  <td><input disabled></td>
  <td><input value="0" disabled></td>
  <td><input value="0" disabled></td>
  <td><input value="0" disabled></td>
  <td><input disabled></td>
  <td><div class="sort-box">READY</div></td>
  `;
  tbody.appendChild(tr);
}

for(let i=0;i<10;i++) createRow();

/* EDIT */
editBtn.onclick=()=>{
  editMode=true;
  updateBtn.style.display="inline-block";

  document.querySelectorAll("tbody input").forEach(i=>{
    i.disabled=false;
    i.classList.add("editable");
  });
};

/* UPDATE */
updateBtn.onclick=()=>{
  alert("Updated!");
  updateBtn.style.display="none";
  editMode=false;

  document.querySelectorAll("tbody input").forEach(i=>{
    i.disabled=true;
    i.classList.remove("editable");
  });
};

/* ADD ROW */
addRow.onclick=()=>{
  createRow();
};

/* REMOVE ROW */
removeRow.onclick=()=>{
  if(tbody.lastChild) tbody.removeChild(tbody.lastChild);
};

/* STATUS */
document.addEventListener("click",e=>{
  if(e.target.classList.contains("sort-box") && editMode){
    e.target.classList.toggle("sold");
    e.target.innerText=e.target.classList.contains("sold")?"SOLD":"READY";
  }
});

/* INPUT */
document.addEventListener("input",e=>{
  if(e.target.tagName==="INPUT"){
    let col=e.target.parentElement.cellIndex;
    if(col>=2 && col<=4){
      let val=parseNumber(e.target.value);
      e.target.value=formatNumber(val);
      calculate();
    }
  }
});

/* CALCULATE */
function calculate(){
let totalBuy=0,totalSell=0,totalNego=0;

document.querySelectorAll("tbody tr").forEach(row=>{
  let buy=parseNumber(row.children[2].children[0].value);
  let sell=parseNumber(row.children[3].children[0].value);
  let nego=parseNumber(row.children[4].children[0].value);

  let profit=sell-buy-nego;
  row.children[5].children[0].value=formatNumber(profit);

  totalBuy+=buy;
  totalSell+=sell;
  totalNego+=nego;
});

let totalProfit=totalSell-totalBuy-totalNego;

totalBuyEl.innerText=formatNumber(totalBuy);
totalSellEl.innerText=formatNumber(totalSell);
totalNegoEl.innerText=formatNumber(totalNego);
totalProfitEl.innerText=formatNumber(totalProfit);

formatDLWL(totalProfit);
}

/* DL WL */
function formatDLWL(v){
let dl=Math.floor(v/100);
let wl=v%100;
formatEl.innerText=dl+" DL / "+wl+" WL";
}

/* CONVERT */
function handleConvert(input,cb){
input.addEventListener("input",()=>{
  let val=parseNumber(input.value);
  input.value=formatNumber(val);
  cb(val);
});
}

handleConvert(wlInput,v=> wlToDl.innerText=formatNumber(v/100));
handleConvert(dlInput,v=> dlToWl.innerText=formatNumber(v*100));
handleConvert(dlBglInput,v=> dlToBgl.innerText=formatNumber(v/100));
handleConvert(bglInput,v=> bglToWl.innerText=formatNumber(v*100*100));

</script>

</body>
</html>
