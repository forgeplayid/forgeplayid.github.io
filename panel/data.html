<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body {
  font-family: Arial;
  background: #020617;
  color: white;
  margin: 0;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;
}

.logo img { height:40px; }

.header-right a {
  padding:8px 18px;
  background:#ef4444;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

.layout {
  display:flex;
  min-height: calc(100vh - 70px);
}

.sidebar {
  width:180px;
  background:#0f172a;
  border-right:1px solid #1e293b;
  padding:15px 10px;
}

.menu {
  display:block;
  padding:10px;
  margin-bottom:8px;
  background:#1e293b;
  color:white;
  text-decoration:none;
  border-radius:6px;
}

.content { flex:1; padding:30px; }

table { width:100%; border-collapse:collapse; }

th, td {
  border:1px solid #1e293b;
  padding:6px;
  text-align:center;
}

input {
  width:90%;
  background:#334155;
  border:none;
  color:white;
  text-align:center;
}

input.editable {
  background:white;
  color:black;
}

/* STATUS */
.sort-box{
  padding:6px;
  border:1px solid #38bdf8;
  border-radius:8px;
  color:#38bdf8;
  cursor:pointer;
}

.sort-box.sold{
  border-color:#ef4444;
  color:#ef4444;
}

/* ACTION */
.action-bar{
  margin-top:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

button {
  padding:10px;
  margin-right:8px;
  border:none;
  cursor:pointer;
  border-radius:5px;
}

#editBtn { background:orange; }
#updateBtn { background:limegreen; display:none; }
#addBtn { background:#3b82f6; color:white; }
#removeBtn { background:#ef4444; color:white; }

/* CONVERT */
.convert{
  margin-top:20px;
  background:#0f172a;
  padding:15px;
  border-radius:10px;
}

.convert-item{
  margin-top:10px;
}

.convert input{
  width:120px;
  background:white;
  color:black;
}

/* MSG */
#msg{
  margin-top:10px;
  font-size:13px;
  font-weight:600;
  min-height:18px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png">
  </div>
  <div class="header-right">
    <a href="#">Log Out</a>
  </div>
</div>

<div class="layout">

<div class="sidebar">
  <a href="#" class="menu">Dashboard</a>
  <a href="#" class="menu">List Harga</a>
  <a href="#" class="menu">List World</a>
  <a href="#" class="menu">Info</a>
</div>

<div class="content">

<h2>Admin Untung Rugi</h2>

<table>
<thead>
<tr>
<th>World</th>
<th>Description</th>
<th>BUY</th>
<th>SELL</th>
<th>NEGO</th>
<th>PROFIT</th>
<th>STATUS</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

<tfoot>
<tr>
<td colspan="2">TOTAL</td>
<td id="totalBuy">0</td>
<td id="totalSell">0</td>
<td id="totalNego">0</td>
<td id="totalProfit">0</td>
<td>-</td>
</tr>
</tfoot>
</table>

<div class="action-bar">

<div>
<button id="editBtn">EDIT</button>
<button id="updateBtn">UPDATE</button>
<button id="addBtn">+</button>
<button id="removeBtn">-</button>

<div id="msg"></div>

</div>

<div>
Format DL/WL: <b id="format">0 DL / 0 WL</b>
</div>

</div>

<!-- ✅ CONVERT (FULL BALIK LAGI) -->
<div class="convert">
<b>CONVERT :</b>

<div class="convert-item">
<input id="wlInput"> WL = <span id="wlToDl">0</span> DL
</div>

<div class="convert-item">
<input id="dlInput"> DL = <span id="dlToWl">0</span> WL
</div>

<div class="convert-item">
<input id="dlBglInput"> DL = <span id="dlToBgl">0</span> BGL
</div>

<div class="convert-item">
<input id="bglInput"> BGL = <span id="bglToWl">0</span> WL
</div>

<div class="convert-item">
<input id="bglToDlInput"> BGL = <span id="bglToDl">0</span> DL
</div>

</div>

</div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyxM6gjh2JPi1BENAndUPEJ6ireXJjdh-rM8sSPz36lfdxuMVoo080ucMWYdLkbVrduWw/exec";

const tbody = document.getElementById("tableBody");

const totalBuyEl = document.getElementById("totalBuy");
const totalSellEl = document.getElementById("totalSell");
const totalNegoEl = document.getElementById("totalNego");
const totalProfitEl = document.getElementById("totalProfit");
const formatEl = document.getElementById("format");
const msg = document.getElementById("msg");

let editMode = false;

/* FORMAT */
function formatNumber(n){
  return (n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
}
function parseNumber(v){
  return parseInt((v||"").replace(/\./g,""))||0;
}

/* LOAD */
async function loadData(){
  const res = await fetch(API_URL);
  const data = await res.json();

  tbody.innerHTML = "";

  data.forEach(r=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td><input value="${r.world||""}" disabled></td>
      <td><input value="${r.description||""}" disabled></td>
      <td><input value="${formatNumber(r.buy)}" disabled></td>
      <td><input value="${formatNumber(r.sell)}" disabled></td>
      <td><input value="${formatNumber(r.nego)}" disabled></td>
      <td><input disabled></td>
      <td><div class="sort-box ${r.status==='SOLD'?'sold':''}">${r.status||'READY'}</div></td>
    `;

    tbody.appendChild(tr);
  });

  calculate();
}

/* EDIT */
document.getElementById("editBtn").onclick = ()=>{
  editMode = true;
  document.getElementById("updateBtn").style.display = "inline-block";

  document.querySelectorAll("tbody input").forEach((i,idx)=>{
    if(idx%7 !== 5){
      i.disabled = false;
      i.classList.add("editable");
    }
  });
};

/* UPDATE (HANYA SIMULASI + LOCK LAGI) */
document.getElementById("updateBtn").onclick = ()=>{
  editMode = false;
  document.getElementById("updateBtn").style.display = "none";

  document.querySelectorAll("tbody input").forEach(i=>{
    i.disabled = true;
    i.classList.remove("editable");
  });

  msg.innerText = "✅ Update berhasil";
  msg.style.color = "#22c55e";

  setTimeout(()=>msg.innerText="",5000);
};

/* ADD */
document.getElementById("addBtn").onclick = ()=>{
  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td><input></td>
    <td><input></td>
    <td><input value="0"></td>
    <td><input value="0"></td>
    <td><input value="0"></td>
    <td><input disabled></td>
    <td><div class="sort-box">READY</div></td>
  `;

  tbody.appendChild(tr);
};

/* REMOVE */
document.getElementById("removeBtn").onclick = ()=>{
  if(tbody.lastChild) tbody.removeChild(tbody.lastChild);
};

/* STATUS */
document.addEventListener("click",e=>{
  if(e.target.classList.contains("sort-box") && editMode){
    e.target.classList.toggle("sold");
    e.target.innerText = e.target.classList.contains("sold") ? "SOLD" : "READY";
  }
});

/* INPUT + CALC REALTIME */
document.addEventListener("input",e=>{
  if(e.target.tagName==="INPUT"){
    let col = e.target.parentElement.cellIndex;
    if(col>=2 && col<=4){
      let val = parseNumber(e.target.value);
      e.target.value = formatNumber(val);
      calculate();
    }
  }
});

/* CALC */
function calculate(){
  let buy=0,sell=0,nego=0;

  document.querySelectorAll("tbody tr").forEach(r=>{
    let b = parseNumber(r.children[2].children[0].value);
    let s = parseNumber(r.children[3].children[0].value);
    let n = parseNumber(r.children[4].children[0].value);

    buy += b;
    sell += s;
    nego += n;

    let profit = s - b - n;
    r.children[5].children[0].value = formatNumber(profit);
  });

  let totalProfit = sell - buy - nego;

  totalBuyEl.innerText = formatNumber(buy);
  totalSellEl.innerText = formatNumber(sell);
  totalNegoEl.innerText = formatNumber(nego);
  totalProfitEl.innerText = formatNumber(totalProfit);

  let dl = Math.floor(totalProfit/100);
  let wl = totalProfit%100;
  formatEl.innerText = dl + " DL / " + wl + " WL";
}

/* CONVERT */
function bind(input,cb){
  input.addEventListener("input",()=>{
    let v = parseNumber(input.value);
    input.value = formatNumber(v);
    cb(v);
  });
}

bind(wlInput,v=>wlToDl.innerText=formatNumber(v/100));
bind(dlInput,v=>dlToWl.innerText=formatNumber(v*100));
bind(dlBglInput,v=>dlToBgl.innerText=formatNumber(v/100));
bind(bglInput,v=>bglToWl.innerText=formatNumber(v*100*100));
bind(bglToDlInput,v=>bglToDl.innerText=formatNumber(v*100));

loadData();
</script>

</body>
</html>
