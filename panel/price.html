<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://uniplay.id/cdn/fb64-pic2d7fab3824dd00bb3c05f0002b466e6c1762906411.png">
<title>Dashboard Admin</title>

<style>
body {
  font-family: Arial;
  background: #020617;
  color: white;
  margin: 0;
}

* {
  box-sizing: border-box;
}

/* HEADER ATAS */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;
}

.logo img {
  height:40px;
}

/* LOGOUT */
.header-right a {
  display:inline-block;
  padding:8px 18px;
  font-weight:bold;
  border-radius:6px;
  text-decoration:none;
  color:white;
  background:#ef4444;
}

.header-right a:hover {
  background:#dc2626;
}

/* LAYOUT */
.layout {
  display: flex;
  min-height: calc(100vh - 70px);
}

/* SIDEBAR */
.sidebar {
  width: 180px;
  background: #0f172a;
  border-right: 1px solid #1e293b;
  padding: 15px 10px;
  flex-shrink: 0;
}

/* MENU */
.menu {
  display: block;
  padding: 10px;
  margin-bottom: 8px;
  background: #1e293b;
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-size: 13px;
}

.menu:hover {
  background: #38bdf8;
  color: #020617;
}

.menu.active {
  background: #38bdf8;
  color: #020617;
}

/* CONTENT */
.content {
  flex: 1;
  padding: 30px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* CARD */
.card {
  width: 100%;
  max-width: 760px;
  background: #1e293b;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.22);
}

.card-header {
  margin-bottom: 20px;
}

.card-header h2 {
  margin: 0 0 8px 0;
  color: #38bdf8;
  font-size: 18px;
}

.card-header p {
  margin: 0;
  color: #94a3b8;
  font-size: 13px;
  line-height: 1.5;
}

/* FORM */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(220px, 1fr));
  gap: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group.full {
  grid-column: 1 / -1;
}

.form-label {
  color: #38bdf8;
  font-size: 13px;
  margin-bottom: 6px;
  font-weight: 600;
}

input, button {
  width:100%;
  padding:11px 12px;
  font-size:15px;
  border-radius:8px;
  border:none;
}

input {
  background:#ffffff;
  color:#020617;
}

button {
  background:#38bdf8;
  color:#020617;
  font-weight:700;
  cursor:pointer;
  margin-top: 4px;
}

button:hover {
  background:#0ea5e5;
}

.status-wrap {
  margin-top: 10px;
  min-height: 20px;
}

small {
  color:#94a3b8;
  font-size: 13px;
}

@media(max-width:768px){
  .content {
    padding: 16px;
  }

  .header {
    padding: 15px 20px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<script>
if (localStorage.getItem("admin_login") !== "true") {
  window.location.replace("https://forgeplayid.github.io/panel/login.html");
}
</script>

<div class="header">
  <div class="logo">
    <a href="dashboard.html">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="ForgePlayID">
    </a>
  </div>

  <div class="header-right">
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</div>

<div class="layout">

  <div class="sidebar">
    <a href="dashboard.html" class="menu">Dashboard</a>
    <a href="price.html" class="menu active">List Harga</a>
    <a href="world.html" class="menu">List World</a>
    <a href="info.html" class="menu">Info</a>
    <a href="data.html" class="menu">Data</a>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-header">
        <h2>LIST HARGA</h2>
        <p>Atur harga jual dan beli untuk kebutuhan tampilan website dan panel admin.</p>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="sell-dl">Sell DL (Rp)</label>
          <input type="number" id="sell-dl" placeholder="Masukkan harga sell DL">
        </div>

        <div class="form-group">
          <label class="form-label" for="buy-dl">Buy DL (Rp)</label>
          <input type="number" id="buy-dl" placeholder="Masukkan harga buy DL">
        </div>

        <div class="form-group full">
          <label class="form-label" for="sell-bgl">Sell BGL (Rp)</label>
          <input type="number" id="sell-bgl" placeholder="Masukkan harga sell BGL">
        </div>

        <div class="form-group full">
          <button id="updateBtn">~~~~~ UPDATE HARGA ~~~~~</button>
        </div>
      </div>

      <div class="status-wrap">
        <small id="harga-status"></small>
      </div>
    </div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_6B0ZkW-ryB9pN6YRNnaBVmFNTLPup329yclGXvoWmQMgWY7a2ofeuTnvxnFcSemZUg/exec";

/* =========================
   STATUS HELPER (AUTO HILANG 5 DETIK)
========================= */
function showStatus(msg, success=true){
    const el = document.getElementById("harga-status");
    el.textContent = msg;
    el.style.color = success ? "#22c55e" : "#ef4444";

    setTimeout(()=>{
        el.textContent = "";
    }, 5000);
}

/* =========================
   LOAD HARGA
========================= */
async function loadHarga(){
    try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();

        document.getElementById("sell-dl").value = data.sell_dl || "";
        document.getElementById("sell-bgl").value = data.sell_bgl || "";
        document.getElementById("buy-dl").value = data.buy_dl || "";

    } catch(err){
        console.error("Load error:", err);
    }
}

/* =========================
   UPDATE HARGA
========================= */
document.getElementById("updateBtn").addEventListener("click", async function(){

    const sellDL = document.getElementById("sell-dl").value;
    const sellBGL = document.getElementById("sell-bgl").value;
    const buyDL = document.getElementById("buy-dl").value;

    if(!sellDL && !sellBGL && !buyDL){
        showStatus("Isi minimal satu harga!", false);
        return;
    }

    const payload = {
        sell_dl: sellDL,
        sell_bgl: sellBGL,
        buy_dl: buyDL
    };

    try {
        const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        });

        const text = await res.text();

        let result;
        try {
            result = JSON.parse(text);
        } catch (e) {
            result = { status: "error" };
        }

        if(result.status === "ok"){
            showStatus("✅ Harga berhasil diupdate!", true);
            loadHarga();
        } else {
            showStatus("❌ Gagal update!", false);
        }

    } catch(err){
        console.error(err);
        showStatus("❌ Gagal update!", false);
    }
});

/* LOGOUT */
document.getElementById("logoutBtn").addEventListener("click", function(e){
    e.preventDefault();
    localStorage.removeItem("admin_login");
    window.location.href = "https://forgeplayid.github.io/panel/login.html";
});

/* INIT */
window.onload = loadHarga;
</script>

</body>
</html>
