<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin</title>

<style>
body {
  font-family: Arial;
  background: #020617;
  color: white;
  margin: 0;
}

/* HEADER ATAS */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;
}

.logo img {
  height:40px;
}

/* LOGOUT */
.header-right a {
  display:inline-block;
  padding:8px 18px;
  font-weight:bold;
  border-radius:6px;
  text-decoration:none;
  color:white;
  background:#ef4444;
}

.header-right a:hover {
  background:#dc2626;
}

/* LAYOUT */
.layout {
  display: flex;
  min-height: calc(100vh - 70px);
}

/* SIDEBAR */
.sidebar {
  width: 180px;
  background: #0f172a;
  border-right: 1px solid #1e293b;
  padding: 15px 10px;
}

/* MENU */
.menu {
  display: block;
  padding: 10px;
  margin-bottom: 8px;
  background: #1e293b;
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-size: 13px;
}

.menu:hover {
  background: #38bdf8;
  color: #020617;
}

.menu.active {
  background: #38bdf8;
  color: #020617;
}

/* CONTENT */
.content {
  flex: 1;
  padding: 30px;
}

/* CARD */
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
  max-width: 500px;
}

/* FORM */
input, button {
  width:100%;
  padding:10px;
  margin:8px 0;
  font-size:16px;
  border-radius:6px;
  border:none;
}

button {
  background:#38bdf8;
  color:#020617;
  font-weight:600;
  cursor:pointer;
}

button:hover {
  background:#0ea5e5;
}

h2,h3 {
  color:#38bdf8;
}

small {
  color:#94a3b8;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <a href="dashboard.html">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png">
    </a>
  </div>

  <div class="header-right">
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="dashboard.html" class="menu">Dashboard</a>
    <a href="price.html" class="menu active">List Harga</a>
    <a href="world.html" class="menu">List World</a>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="card">
      <h2>Dashboard Admin</h2>
      <h3>List Harga</h3>

      <input type="number" id="sell-dl" placeholder="Sell DL (Rp)">
      <input type="number" id="sell-bgl" placeholder="Sell BGL (Rp)">
      <input type="number" id="buy-dl" placeholder="Buy DL (Rp)">

      <button id="updateBtn">~~~~~ UPDATE HARGA ~~~~~</button>
      <small id="harga-status"></small>
    </div>

  </div>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_6B0ZkW-ryB9pN6YRNnaBVmFNTLPup329yclGXvoWmQMgWY7a2ofeuTnvxnFcSemZUg/exec";

/* =========================
   STATUS HELPER (AUTO HILANG 5 DETIK)
========================= */
function showStatus(msg, success=true){
    const el = document.getElementById("harga-status");
    el.textContent = msg;
    el.style.color = success ? "#22c55e" : "#ef4444";

    setTimeout(()=>{
        el.textContent = "";
    }, 5000);
}

/* =========================
   LOAD HARGA
========================= */
async function loadHarga(){
    try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();

        document.getElementById("sell-dl").value = data.sell_dl || "";
        document.getElementById("sell-bgl").value = data.sell_bgl || "";
        document.getElementById("buy-dl").value = data.buy_dl || "";

    } catch(err){
        console.error("Load error:", err);
    }
}

/* =========================
   UPDATE HARGA (FIX FINAL)
========================= */
document.getElementById("updateBtn").addEventListener("click", async function(){

    const sellDL = document.getElementById("sell-dl").value;
    const sellBGL = document.getElementById("sell-bgl").value;
    const buyDL = document.getElementById("buy-dl").value;

    if(!sellDL && !sellBGL && !buyDL){
        showStatus("Isi minimal satu harga!", false);
        return;
    }

    const payload = {
        sell_dl: sellDL,
        sell_bgl: sellBGL,
        buy_dl: buyDL
    };

    try {
        const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        });

        const text = await res.text();

        let result;
        try {
            result = JSON.parse(text);
        } catch (e) {
            result = { status: "error" };
        }

        if(result.status === "ok"){
            showStatus("✅ Harga berhasil diupdate!", true);
            loadHarga();
        } else {
            showStatus("❌ Gagal update!", false);
        }

    } catch(err){
        console.error(err);
        showStatus("❌ Gagal update!", false);
    }
});

/* LOGOUT */
document.getElementById("logoutBtn").addEventListener("click", function(e){
    e.preventDefault();
    localStorage.removeItem("admin_login");
    window.location.href = "login.html";
});

/* INIT */
window.onload = loadHarga;

</script>

</body>
</html>
