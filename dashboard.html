<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin</title>

<style>
/* ===== BODY & CONTAINER ===== */
body {
    font-family: Arial, sans-serif;
    background: #020617;
    color: white;
    margin: 0;
}
.container {
    max-width: 500px;
    margin: 30px auto;
    padding: 0 15px;
}

/* ===== HEADER ===== */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background-color: #0f172a;
    border-bottom: 1px solid #1e293b;
}
.header .logo img {
    height: 40px;
}
.header .header-right a.button {
    display: inline-block;
    padding: 8px 18px;
    background-color: #ef4444; /* merah */
    color: white;
    font-weight: bold;
    border-radius: 6px;
    text-decoration: none;
    transition: background-color 0.2s;
}
.header .header-right a.button:hover {
    background-color: #dc2626;
}

/* ===== CARD ===== */
.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
}
input, button {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    font-size: 16px;
}
button {
    background: #38bdf8;
    border: none;
    cursor: pointer;
    font-weight: 600;
}
h2, h3 {
    color: #38bdf8;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">
        <a href="https://forgeplayid.github.io/">
            <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="Logo">
        </a>
    </div>
    <div class="header-right">
        <a href="login.html" class="button" onclick="logout()">Log Out</a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="container">
<div class="card">
    <h2>Dashboard Admin</h2>

    <h3>List Harga</h3>
    <input type="number" id="sell-dl" placeholder="Sell DL (Rp)">
    <input type="number" id="sell-bgl" placeholder="Sell BGL (Rp)">
    <input type="number" id="buy-dl" placeholder="Buy DL (Rp)">

    <button onclick="updateData()">~~~~~ UPDATE ~~~~~</button>
</div>
</div>

<script>
const SHEETDB_ENDPOINT = "https://sheetdb.io/api/v1/1ri315wnzcjy2";

// ===== UPDATE FUNCTION =====
function updateData(){
    const sellDL = document.getElementById("sell-dl").value;
    const sellBGL = document.getElementById("sell-bgl").value;
    const buyDL = document.getElementById("buy-dl").value;

    if(!sellDL && !sellBGL && !buyDL){
        alert("Isi minimal satu harga untuk update!");
        return;
    }

    fetch(SHEETDB_ENDPOINT)
      .then(res => res.json())
      .then(data => {
          const rowId = data[0].id; // ambil ID baris pertama

          const payload = {};
          if(sellDL) payload.sell_dl = Number(sellDL);
          if(sellBGL) payload.sell_bgl = Number(sellBGL);
          if(buyDL) payload.buy_dl = Number(buyDL);

          fetch(`${SHEETDB_ENDPOINT}/${rowId}`, {
              method: "PUT",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({ data: [payload] })
          })
          .then(res => res.json())
          .then(resp => {
              console.log("Update sukses:", resp);
              alert("Harga berhasil diupdate!");
              document.getElementById("sell-dl").value = "";
              document.getElementById("sell-bgl").value = "";
              document.getElementById("buy-dl").value = "";
          })
          .catch(err => {
              console.error("Gagal update:", err);
              alert("Gagal update harga!");
          });
      })
      .catch(err => {
          console.error("Gagal fetch data SheetDB:", err);
          alert("Gagal ambil data SheetDB!");
      });
}

// ===== LOGOUT FUNCTION =====
function logout(){
    localStorage.removeItem("admin_login");
}
</script>

</body>
</html>
