<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin</title>
<style>
body { font-family: Arial; background: #020617; color: white; margin:0; }
.header { display:flex; justify-content:space-between; align-items:center; padding:15px 40px; background:#0f172a; border-bottom:1px solid #1e293b; }
.header .logo img { height:40px; }
.header .header-right a { display:inline-block; padding:8px 18px; font-weight:bold; border-radius:6px; text-decoration:none; color:white; background:#ef4444; }
.header .header-right a:hover { background:#dc2626; }
.container { max-width:600px; margin:30px auto; padding:0 15px; }
.card { background: #1e293b; padding:20px; border-radius:10px; margin-bottom:20px; }
input, textarea, select, button { width:100%; padding:10px; margin:8px 0; font-size:16px; }
button { background: #38bdf8; border:none; cursor:pointer; font-weight:600; }
h2,h3 { color:#38bdf8; }
small { color:#94a3b8; display:block; margin-top:-6px; margin-bottom:6px; }
.list-world { margin-top:15px; }
.list-world-item { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; border-bottom:1px solid #334155; border-radius:6px; margin-bottom:6px; }
.list-world-item span.status { font-weight:600; padding:2px 8px; border-radius:6px; }
.status-ready { background-color:#22c55e; color:#020617; }
.status-sold { background-color:#ef4444; color:white; }
.action-buttons button { margin-left:6px; padding:4px 10px; font-size:14px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <a href="https://forgeplayid.github.io/dashboard.html">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="Logo">
    </a>
  </div>
  <div class="header-right">
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</div>

<div class="container">

<!-- ===== HARGA ===== -->
<div class="card">
<h2>Dashboard Admin</h2>
<h3>List Harga</h3>
<input type="number" id="sell-dl" placeholder="Sell DL (Rp)">
<input type="number" id="sell-bgl" placeholder="Sell BGL (Rp)">
<input type="number" id="buy-dl" placeholder="Buy DL (Rp)">
<button onclick="updateData()">~~~~~ UPDATE ~~~~~</button>
</div>

<!-- ===== LIST WORLD BARU ===== -->
<div class="card">
<h3>LIST WORLD</h3>
<input type="text" id="world-image" placeholder="Link Gambar">
<small>Ukuran disarankan 1280 x 798</small>
<input type="text" id="world-name" placeholder="Name">
<textarea id="world-desc" placeholder="Deskripsi"></textarea>
<button onclick="tambahWorld()">~~~~~ UPDATE ~~~~~</button>

<div id="world-list" class="list-world"></div>
</div>

</div>

<script>
const SHEETDB_ENDPOINT = "https://sheetdb.io/api/v1/lcgaa49k16h8g"; // Endpoint WORLD
const SHEETDB_HARGA = "https://sheetdb.io/api/v1/1ri315wnzcjy2";
const ROW_HARGA = 1;

// ===== UPDATE HARGA =====
function updateData(){
    const sellDL = document.getElementById("sell-dl").value;
    const sellBGL = document.getElementById("sell-bgl").value;
    const buyDL = document.getElementById("buy-dl").value;

    if(!sellDL && !sellBGL && !buyDL){
        alert("Isi minimal satu harga untuk update!");
        return;
    }

    const payload = {};
    if(sellDL) payload.sell_dl = Number(sellDL);
    if(sellBGL) payload.sell_bgl = Number(sellBGL);
    if(buyDL) payload.buy_dl = Number(buyDL);

    fetch(`${SHEETDB_HARGA}/id/${ROW_HARGA}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ data: [payload] })
    })
    .then(res => res.json())
    .then(resp => {
        alert("Harga berhasil diupdate!");
        document.getElementById("sell-dl").value = "";
        document.getElementById("sell-bgl").value = "";
        document.getElementById("buy-dl").value = "";
    })
    .catch(err => { alert("Gagal update harga! "+err.message); });
}

// ===== LOAD LIST WORLD =====
function loadWorldList(){
    fetch(SHEETDB_ENDPOINT)
    .then(res=>res.json())
    .then(data=>{
        const list = document.getElementById("world-list");
        list.innerHTML = "";
        data.forEach(item=>{
            const div = document.createElement("div");
            div.className = "list-world-item";
            div.innerHTML = `
                <span>${item.name} </span>
                <span class="status status-${item.status.toLowerCase()}">${item.status}</span>
                <span class="action-buttons">
                    <button onclick="editStatus('${item._id}','${item.name}')">EDIT</button>
                    <button onclick="deleteWorld('${item._id}','${item.name}')">DELETE</button>
                </span>
            `;
            list.appendChild(div);
        });
    });
}

// ===== TAMBAH WORLD =====
function tambahWorld(){
    const image = document.getElementById("world-image").value;
    const name = document.getElementById("world-name").value;
    const desc = document.getElementById("world-desc").value;

    if(!image || !name || !desc){
        alert("Semua field wajib diisi!");
        return;
    }

    const data = { data: [{ image_url:image, name:name, description:desc, status:"READY" }] };

    fetch(SHEETDB_ENDPOINT,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(data)
    })
    .then(res=>res.json())
    .then(res=>{
        alert("World berhasil ditambahkan!");
        document.getElementById("world-image").value="";
        document.getElementById("world-name").value="";
        document.getElementById("world-desc").value="";
        loadWorldList();
    })
    .catch(err=>{
        console.error(err);
        alert("Gagal tambah world!");
    });
}

// ===== EDIT STATUS =====
function editStatus(id,name){
    const newStatus = prompt(`Ubah status "${name}" menjadi READY atau SOLD:`,"READY");
    if(!newStatus) return;
    if(newStatus.toUpperCase() !== "READY" && newStatus.toUpperCase() !== "SOLD"){ alert("Status hanya READY atau SOLD"); return; }

    fetch(`${SHEETDB_ENDPOINT}/id/${id}`,{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ data:[{ status:newStatus.toUpperCase() }] })
    })
    .then(res=>res.json())
    .then(()=>{ loadWorldList(); })
    .catch(err=>{ console.error(err); alert("Gagal update status"); });
}

// ===== DELETE WORLD =====
function deleteWorld(id,name){
    if(confirm(`Apakah yakin ingin menghapus "${name}"?`)){
        fetch(`${SHEETDB_ENDPOINT}/id/${id}`,{ method:"DELETE" })
        .then(res=>res.json())
        .then(()=>{ loadWorldList(); })
        .catch(err=>{ console.error(err); alert("Gagal hapus world"); });
    }
}

// ===== LOGOUT =====
document.getElementById("logoutBtn").addEventListener("click", function(e){
    e.preventDefault();
    localStorage.removeItem("admin_login");
    alert("Log Out berhasil!");
    window.location.href = "login.html";
});

// ===== INITIAL LOAD =====
loadWorldList();
</script>

</body>
</html>
