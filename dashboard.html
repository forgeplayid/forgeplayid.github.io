<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin</title>

<style>
body {
    font-family: Arial;
    background: #020617;
    color: white;
}
.container {
    max-width: 500px;
    margin: 50px auto;
}
input, button {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    font-size: 16px;
}
button {
    background: #38bdf8;
    border: none;
    cursor: pointer;
    font-weight: 600;
}
.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
}
h2, h3 {
    color: #38bdf8;
}
</style>
</head>
<body>

<div class="container">

<div class="card">
    <h2>Dashboard Admin</h2>

    <h3>List Harga</h3>
    <input type="number" id="sell-dl" placeholder="Sell DL (Rp)">
    <input type="number" id="sell-bgl" placeholder="Sell BGL (Rp)">
    <input type="number" id="buy-dl" placeholder="Buy DL (Rp)">

    <button onclick="updateData()">~~~~~ UPDATE ~~~~~</button>
</div>

</div>

<script>
const SHEETDB_ENDPOINT = "https://sheetdb.io/api/v1/1ri315wnzcjy2";

// ===== UPDATE FUNCTION =====
function updateData(){
    const sellDL = document.getElementById("sell-dl").value;
    const sellBGL = document.getElementById("sell-bgl").value;
    const buyDL = document.getElementById("buy-dl").value;

    if(!sellDL && !sellBGL && !buyDL){
        alert("Isi minimal satu harga untuk update!");
        return;
    }

    const data = [
        { key: "sell_dl", value: sellDL },
        { key: "sell_bgl", value: sellBGL },
        { key: "buy_dl", value: buyDL }
    ];

    data.forEach(item => {
        if(item.value){ // hanya update jika ada input
            fetch(`${SHEETDB_ENDPOINT}/key/${item.key}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ data: [{ value: Number(item.value) }] })
            })
            .then(res => res.json())
            .then(resp => console.log(resp))
            .catch(err => console.error(err));
        }
    });

    alert("Harga berhasil diupdate!");

    // Reset input
    document.getElementById("sell-dl").value = "";
    document.getElementById("sell-bgl").value = "";
    document.getElementById("buy-dl").value = "";
}
</script>

</body>
</html>
