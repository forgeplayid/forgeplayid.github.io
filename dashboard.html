<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin</title>

<style>
body { font-family: Arial; background:#020617; color:white; margin:0; }
.header { display:flex; justify-content:space-between; align-items:center; padding:15px 40px; background:#0f172a; border-bottom:1px solid #1e293b; }
.logo img { height:40px; }
.header-right a { padding:8px 18px; background:#ef4444; color:white; font-weight:bold; border-radius:6px; text-decoration:none; }

.container { max-width:600px; margin:30px auto; padding:0 15px; }

.card {
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
}

input, button {
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:6px;
  font-size:16px;
}

button {
  background:#38bdf8;
  color:#020617;
  font-weight:bold;
  cursor:pointer;
}

h2,h3 { color:#38bdf8; margin-bottom:10px; }

#world-list div {
  background:#0f172a;
  padding:10px;
  border-radius:6px;
  margin-bottom:8px;
  font-size:14px;
}

.action-btn {
  margin-left:5px;
  padding:3px 8px;
  font-size:12px;
  cursor:pointer;
  border-radius:4px;
  border:none;
}

.edit { background:#22c55e; color:#020617; }
.delete { background:#ef4444; color:white; }
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    <a href="dashboard.html">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png">
    </a>
  </div>
  <div class="header-right">
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</div>

<div class="container">

<!-- ================= HARGA (TIDAK DIUBAH) ================= -->
<div class="card">
<h2>Dashboard Admin</h2>
<h3>List Harga</h3>

<input type="number" id="sell-dl" placeholder="Sell DL (Rp)">
<input type="number" id="sell-bgl" placeholder="Sell BGL (Rp)">
<input type="number" id="buy-dl" placeholder="Buy DL (Rp)">

<button onclick="updateHarga()">~~~~~ UPDATE HARGA ~~~~~</button>
<small id="harga-status"></small>
</div>

<!-- ================= WORLD ================= -->
<div class="card">
<h3>Tambah World</h3>

<input type="text" id="world-name" placeholder="Nama World">
<input type="text" id="world-img" placeholder="Link Gambar">
<input type="text" id="world-desc" placeholder="Deskripsi">

<button onclick="tambahWorld()">+ TAMBAH WORLD</button>

<h3>List World</h3>
<div id="world-list"></div>
</div>

</div>

<script>
// ================= HARGA (JANGAN DIUBAH) =================
const RATE_API = "https://sheetdb.io/api/v1/4rjuhig0n2xsl";

function loadHarga(){
    fetch(`${RATE_API}/search?id=1`)
    .then(res => res.json())
    .then(data => {
        if(data && data.length > 0){
            const row = data[0];
            document.getElementById("sell-dl").value = row.sell_dl || "";
            document.getElementById("sell-bgl").value = row.sell_bgl || "";
            document.getElementById("buy-dl").value = row.buy_dl || "";
        }
    });
}

function updateHarga(){
    const sellDL = document.getElementById("sell-dl").value;
    const sellBGL = document.getElementById("sell-bgl").value;
    const buyDL = document.getElementById("buy-dl").value;

    const payload = {};
    if(sellDL) payload.sell_dl = sellDL;
    if(sellBGL) payload.sell_bgl = sellBGL;
    if(buyDL) payload.buy_dl = buyDL;

    fetch(`${RATE_API}/id/1`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ data: payload })
    })
    .then(() => {
        document.getElementById("harga-status").textContent = "Harga berhasil diupdate!";
        setTimeout(()=>document.getElementById("harga-status").textContent="",3000);
        loadHarga();
    });
}

// ================= WORLD =================
const WORLD_API = "https://sheetdb.io/api/v1/ua4s1d2wjbbal?sheet=WORLD";

// LOAD WORLD
function loadWorld(){
    fetch(WORLD_API)
    .then(res => res.json())
    .then(data => {
        const list = document.getElementById("world-list");
        list.innerHTML = "";

        data.forEach((item, index) => {
            const div = document.createElement("div");

            div.innerHTML = `
            ${index+1}. <b>${item.name}</b> (${item.status})
            <button class="action-btn edit" onclick="editWorld('${item.id}')">EDIT</button>
            <button class="action-btn delete" onclick="deleteWorld('${item.id}')">DELETE</button>
            `;

            list.appendChild(div);
        });
    });
}

// TAMBAH WORLD
function tambahWorld(){
    const name = document.getElementById("world-name").value;
    const img = document.getElementById("world-img").value;
    const desc = document.getElementById("world-desc").value;

    if(!name || !img || !desc){
        alert("Isi semua field!");
        return;
    }

    fetch(WORLD_API, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            data: [{
                name: name,
                image_url: img,
                description: desc,
                status: "READY"
            }]
        })
    })
    .then(() => {
        alert("World ditambahkan!");
        document.getElementById("world-name").value = "";
        document.getElementById("world-img").value = "";
        document.getElementById("world-desc").value = "";
        loadWorld();
    });
}

// DELETE WORLD
function deleteWorld(id){
    if(!confirm("Yakin ingin hapus world?")) return;

    fetch(`${WORLD_API}&id=${id}`, {
        method: "DELETE"
    })
    .then(() => {
        alert("Berhasil dihapus");
        loadWorld();
    });
}

// EDIT STATUS
function editWorld(id){
    const status = prompt("Masukkan status: READY / SOLD");

    if(!status) return;

    fetch(`${WORLD_API}&id=${id}`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            data: { status: status }
        })
    })
    .then(() => {
        alert("Status diupdate!");
        loadWorld();
    });
}

// ================= INIT =================
loadHarga();
loadWorld();

// LOGOUT
document.getElementById("logoutBtn").addEventListener("click", function(e){
    e.preventDefault();
    localStorage.removeItem("admin_login");
    alert("Log Out berhasil!");
    window.location.href = "login.html";
});
</script>

</body>
</html>
