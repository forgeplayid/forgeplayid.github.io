<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin</title>
<style>
body { font-family: Arial; background: #020617; color: white; margin:0; }
.header { display:flex; justify-content:space-between; align-items:center; padding:15px 40px; background:#0f172a; border-bottom:1px solid #1e293b; }
.header .logo img { height:40px; }
.header .header-right a { display:inline-block; padding:8px 18px; font-weight:bold; border-radius:6px; text-decoration:none; color:white; background:#ef4444; }
.header .header-right a:hover { background:#dc2626; }
.container { max-width:500px; margin:30px auto; padding:0 15px; }
.card { background: #1e293b; padding:20px; border-radius:10px; margin-bottom:20px; }
input, textarea, button, select { width:100%; padding:10px; margin:8px 0; font-size:16px; }
button { background: #38bdf8; border:none; cursor:pointer; font-weight:600; }
h2,h3 { color:#38bdf8; }
small { color:#94a3b8; }
.world-item { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:10px; background:#0f172a; border-radius:6px; }
.world-item button { width:auto; padding:6px 12px; font-size:14px; }
.world-item span { flex:1; margin-left:10px; word-break:break-word; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <a href="https://forgeplayid.github.io/dashboard.html">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="Logo">
    </a>
  </div>
  <div class="header-right">
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</div>

<div class="container">

<!-- ===== HARGA ===== -->
<div class="card">
<h2>Dashboard Admin</h2>

<h3>List Harga</h3>
<input type="number" id="sell-dl" placeholder="Sell DL (Rp)">
<input type="number" id="sell-bgl" placeholder="Sell BGL (Rp)">
<input type="number" id="buy-dl" placeholder="Buy DL (Rp)">

<button onclick="updateData()">~~~~~ UPDATE ~~~~~</button>
</div>

<!-- ===== LIST WORLD BARU ===== -->
<div class="card">
<h3>LIST WORLD</h3>

<input type="text" id="world-image" placeholder="Link Gambar">
<small>Ukuran disarankan 1280 x 798</small>

<input type="text" id="world-name" placeholder="Name">

<textarea id="world-desc" placeholder="Deskripsi"></textarea>

<select id="world-status">
  <option value="buy">BUY</option>
  <option value="sold">SOLD</option>
</select>

<button onclick="tambahWorld()">~~~~~ UPDATE ~~~~~</button>

<h4>Daftar World</h4>
<div id="world-list"></div>
</div>

</div>

<script>
// ===== ENDPOINT =====
const SHEETDB_HARGA = "https://sheetdb.io/api/v1/1ri315wnzcjy2";
const ROW_ID_HARGA = 1;
const SHEETDB_WORLD = "https://sheetdb.io/api/v1/lcgaa49k16h8g";

// ===== UPDATE HARGA =====
function updateData(){
    const sellDL = document.getElementById("sell-dl").value;
    const sellBGL = document.getElementById("sell-bgl").value;
    const buyDL = document.getElementById("buy-dl").value;

    if(!sellDL && !sellBGL && !buyDL){
        alert("Isi minimal satu harga untuk update!");
        return;
    }

    const payload = {};
    if(sellDL) payload.sell_dl = Number(sellDL);
    if(sellBGL) payload.sell_bgl = Number(sellBGL);
    if(buyDL) payload.buy_dl = Number(buyDL);

    fetch(`${SHEETDB_HARGA}/id/${ROW_ID_HARGA}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ data: [payload] })
    })
    .then(res => res.json())
    .then(resp => {
        alert("Harga berhasil diupdate!");
        document.getElementById("sell-dl").value = "";
        document.getElementById("sell-bgl").value = "";
        document.getElementById("buy-dl").value = "";
    })
    .catch(err => alert("Gagal update harga! " + err.message));
}

// ===== TAMBAH WORLD =====
function tambahWorld(){
    const image = document.getElementById("world-image").value;
    const name = document.getElementById("world-name").value;
    const desc = document.getElementById("world-desc").value;
    const status = document.getElementById("world-status").value;

    if(!image || !name || !desc){
        alert("Semua field wajib diisi!");
        return;
    }

    const data = {
        data: [{ image_url:image, name:name, description:desc, status:status }]
    };

    fetch(SHEETDB_WORLD, {
        method:"POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(data)
    })
    .then(res=>res.json())
    .then(res=>{
        alert("World berhasil ditambahkan!");
        document.getElementById("world-image").value="";
        document.getElementById("world-name").value="";
        document.getElementById("world-desc").value="";
        document.getElementById("world-status").value="buy";
        loadWorlds();
    })
    .catch(err=>{
        console.error(err);
        alert("Gagal tambah world!");
    });
}

// ===== LOAD WORLD =====
function loadWorlds(){
    fetch(SHEETDB_WORLD)
    .then(res=>res.json())
    .then(data=>{
        const container = document.getElementById("world-list");
        container.innerHTML="";
        data.forEach(item=>{
            const div = document.createElement("div");
            div.className="world-item";
            div.innerHTML = `
                <span><strong>${item.name}</strong> - ${item.description} [${item.status.toUpperCase()}]</span>
                <button onclick="toggleStatus('${item.id}', '${item.status}')">${item.status==='buy'?'SOLD':'BUY'}</button>
                <button onclick="hapusWorld('${item.id}')">Hapus</button>
            `;
            container.appendChild(div);
        });
    })
    .catch(err=>console.error('Gagal load world:', err));
}

// ===== TOGGLE STATUS =====
function toggleStatus(id, currentStatus){
    const newStatus = currentStatus==='buy'?'sold':'buy';
    fetch(`${SHEETDB_WORLD}/id/${id}`, {
        method:"PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ data:[{ status:newStatus }] })
    })
    .then(res=>res.json())
    .then(resp=>loadWorlds())
    .catch(err=>console.error(err));
}

// ===== HAPUS WORLD =====
function hapusWorld(id){
    if(!confirm("Yakin mau hapus world ini?")) return;
    fetch(`${SHEETDB_WORLD}/id/${id}`, { method:"DELETE" })
    .then(res=>res.json())
    .then(resp=>loadWorlds())
    .catch(err=>console.error(err));
}

// ===== LOGOUT =====
document.getElementById("logoutBtn").addEventListener("click", function(e){
    e.preventDefault();
    localStorage.removeItem("admin_login");
    alert("Log Out berhasil!");
    window.location.href="login.html";
});

// LOAD WORLD LIST SAAT HALAMAN DIBUKA
loadWorlds();
</script>

</body>
</html>
