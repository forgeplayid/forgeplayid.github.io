<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard Admin</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #020617;
    color: white;
}
.container {
    max-width: 500px;
    margin: 50px auto;
}
input, button {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    font-size: 16px;
}
button {
    background: #38bdf8;
    border: none;
    cursor: pointer;
    font-weight: 600;
}
.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
}
h2, h3 {
    color: #38bdf8;
}
</style>
</head>
<body>

<div class="container">

<div class="card">
    <h2>Dashboard Admin</h2>

    <h3>List Harga</h3>
    <input type="number" id="sell-dl" placeholder="Sell DL (Rp)" />
    <input type="number" id="sell-bgl" placeholder="Sell BGL (Rp)" />
    <input type="number" id="buy-dl" placeholder="Buy DL (Rp)" />

    <button onclick="updateData()">~~~~~ UPDATE ~~~~~</button>
</div>

</div>

<script>
const SHEETDB_ENDPOINT = "https://sheetdb.io/api/v1/1ri315wnzcjy2";

// ===== Fungsi update harga ke SheetDB =====
function updateData() {
    const sellDL = document.getElementById("sell-dl").value;
    const sellBGL = document.getElementById("sell-bgl").value;
    const buyDL = document.getElementById("buy-dl").value;

    if(!sellDL && !sellBGL && !buyDL){
        alert("Isi minimal satu harga untuk update!");
        return;
    }

    // Ambil data sekarang dari SheetDB untuk dapatkan ID baris
    fetch(SHEETDB_ENDPOINT)
      .then(res => {
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return res.json();
      })
      .then(data => {
          // Pastikan data ada dan ambil id baris pertama
          const rowId = data[0]?.id;
          if(!rowId) throw new Error("ID baris tidak ditemukan di SheetDB");

          // Siapkan data payload update
          const payload = {};
          if(sellDL) payload.sell_dl = Number(sellDL);
          if(sellBGL) payload.sell_bgl = Number(sellBGL);
          if(buyDL) payload.buy_dl = Number(buyDL);

          // Kirim PUT request update harga ke SheetDB
          return fetch(`${SHEETDB_ENDPOINT}/${rowId}`, {
              method: "PUT",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({ data: [payload] })
          });
      })
      .then(res => {
          if (!res.ok) throw new Error(`Update gagal, status: ${res.status}`);
          return res.json();
      })
      .then(resp => {
          console.log("Update sukses:", resp);
          alert("Harga berhasil diupdate!");
          // Reset input hanya jika update sukses
          document.getElementById("sell-dl").value = "";
          document.getElementById("sell-bgl").value = "";
          document.getElementById("buy-dl").value = "";
      })
      .catch(err => {
          console.error("Error:", err);
          alert("Gagal update harga! " + err.message);
      });
}
</script>

</body>
</html>
