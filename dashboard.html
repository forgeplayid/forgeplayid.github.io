<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin</title>
<style>
body { font-family: Arial, sans-serif; background: #020617; color: white; margin:0; }
.header { display:flex; justify-content:space-between; align-items:center; padding:15px 40px; background:#0f172a; border-bottom:1px solid #1e293b; }
.header .logo img { height:40px; }
.header .header-right a { display:inline-block; padding:8px 18px; font-weight:bold; border-radius:6px; text-decoration:none; color:white; background:#ef4444; }
.header .header-right a:hover { background:#dc2626; }
.container { max-width:500px; margin:30px auto; padding:0 15px; }
.card { background: #1e293b; padding:20px; border-radius:10px; margin-bottom:20px; }
input, button { width:100%; padding:10px; margin:8px 0; font-size:16px; border-radius:6px; border:none; }
button { background: #38bdf8; color:#020617; font-weight:600; cursor:pointer; transition: 0.2s; }
button:hover { background:#0ea5e9; }
h2,h3 { color:#38bdf8; margin:0 0 10px 0; }
small { color:#94a3b8; display:block; margin-bottom:5px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <a href="dashboard.html">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="Logo">
    </a>
  </div>
  <div class="header-right">
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</div>

<div class="container">

<!-- ===== HARGA ===== -->
<div class="card">
<h2>Dashboard Admin</h2>
<h3>List Harga</h3>
<input type="number" id="sell-dl" placeholder="Sell DL (Rp)">
<input type="number" id="sell-bgl" placeholder="Sell BGL (Rp)">
<input type="number" id="buy-dl" placeholder="Buy DL (Rp)">
<button onclick="updateHarga()">~~~~~ UPDATE HARGA ~~~~~</button>
<small id="harga-status"></small>
</div>

</div>

<script>
const SHEETDB_ENDPOINT = "https://sheetdb.io/api/v1/6yhqr0dzc9c68";
const ROW_ID = 1; // ID baris harga di Sheet RATE

// ===== AMBIL DATA AWAL =====
function loadHarga(){
    fetch(`${SHEETDB_ENDPOINT}/id/${ROW_ID}`)
    .then(res => res.json())
    .then(data => {
        if(data && data[0]){
            document.getElementById("sell-dl").value = data[0].sell_dl || "";
            document.getElementById("sell-bgl").value = data[0].sell_bgl || "";
            document.getElementById("buy-dl").value = data[0].buy_dl || "";
        }
    })
    .catch(err => console.error("Gagal load harga:", err));
}

// ===== UPDATE HARGA =====
function updateHarga(){
    const sellDL = document.getElementById("sell-dl").value;
    const sellBGL = document.getElementById("sell-bgl").value;
    const buyDL = document.getElementById("buy-dl").value;

    if(!sellDL && !sellBGL && !buyDL){
        alert("Isi minimal satu harga untuk update!");
        return;
    }

    const payload = {};
    if(sellDL) payload.sell_dl = Number(sellDL);
    if(sellBGL) payload.sell_bgl = Number(sellBGL);
    if(buyDL) payload.buy_dl = Number(buyDL);

    fetch(`${SHEETDB_ENDPOINT}/id/${ROW_ID}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ data: [payload] })
    })
    .then(res => {
        if(!res.ok) throw new Error(`Status: ${res.status}`);
        return res.json();
    })
    .then(resp => {
        document.getElementById("harga-status").textContent = "Harga berhasil diupdate!";
        setTimeout(()=> document.getElementById("harga-status").textContent="", 3000);
    })
    .catch(err => {
        console.error(err);
        alert("Gagal update harga! " + err.message);
    });
}

// ===== LOGOUT =====
document.getElementById("logoutBtn").addEventListener("click", function(e){
    e.preventDefault();
    localStorage.removeItem("admin_login");
    alert("Log Out berhasil!");
    window.location.href = "login.html";
});

// ===== LOAD DATA AWAL =====
loadHarga();
</script>

</body>
</html>
