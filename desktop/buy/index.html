<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://uniplay.id/cdn/fb64-pic2d7fab3824dd00bb3c05f0002b466e6c1762906411.png">
<title>Pembayaran Blue Gem Lock</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background-color: #020617;
    color: white;
}

/* ================= HEADER ================= */
.header {
    position: relative; /* penting untuk CCTV */
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background-color: #0f172a;
    border-bottom: 1px solid #1e293b;
}

.logo img { height: 35px; }

.header-right a.button {
    padding: 8px 18px;
    background-color: #38bdf8;
    color: #020617;
    font-weight: 600;
    border-radius: 6px;
    text-decoration: none;
}

/* ================= CCTV GIF ================= */
.cctv-gif {
    position: absolute;
    top: 58px;
    left: 70px;
    width: 80px;
    height: auto;
    z-index: 10;
    opacity: 0.95;
    pointer-events: none;
}

/* CONTAINER */
.container {
    max-width: 860px;
    margin: 30px auto;
    padding: 0 15px;
    text-align: center;
}

h1 {
    color: #38bdf8;
    margin-bottom: 20px;
    font-weight: 700;
}

/* 2 IMAGE */
.logo-dl {
    margin-bottom: 15px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.logo-dl img {
    height: 100px;
}

/* BOX */
#rekening-info {
    margin-top: 25px;
    padding: 25px;
    background-color: #1e293b;
    border-radius: 12px;
    font-size: 16px;
    line-height: 1.8;
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
}

/* WORLD LINE */
.world-line {
    margin-top: 8px;
}

/* COPY TEXT */
.copy-text {
    color: #38bdf8;
    font-weight: 700;
    cursor: pointer;
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(56,189,248,0.15);
    transition: 0.2s;
}

.copy-text:hover {
    background: rgba(56,189,248,0.3);
}

/* COPIED */
.copied {
    font-size: 12px;
    color: #22c55e;
    margin-top: 5px;
    opacity: 0;
    transition: 0.3s;
    display: block;
}

/* WHATSAPP */
.whatsapp-btn {
    display: inline-block;
    margin-top: 18px;
    padding: 12px 20px;
    background-color: #25D366;
    color: #020617;
    font-weight: 700;
    border-radius: 8px;
    text-decoration: none;
}

.whatsapp-btn:hover {
    background-color: #1ebe57;
}

/* RESPONSIVE CCTV */
@media (max-width: 500px) {
    .cctv-gif {
        left: 40px;
        top: 55px;
        width: 65px;
    }
}

</style>
</head>

<body>

<div class="header">

    <div class="logo">
        <a href="https://forgeplayid.github.io/">
            <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png">
        </a>
    </div>

    <div class="header-right">
        <a class="button" href="https://forgeplayid.github.io/desktop/world">Cari World Disini</a>
    </div>

    <!-- 🔥 CCTV GIF -->
    <img class="cctv-gif" src="https://forgeplayid.github.io/assets/cctv-growtopia.gif">

</div>

<div class="container">

    <div class="logo-dl">
        <img src="https://forgeplayid.github.io/assets/diamond-lock.png">
        <img src="https://forgeplayid.github.io/assets/blue-gem-lock.png">
    </div>

    <h1>Syarat Jual DL & BGL</h1>

    <div id="rekening-info">

        Minimal Jual : <b>100DL</b><br><br>
        Payment : <b>BISA REQUEST</b><br><br>
        Via Jual : <b>Donation box</b><br><br>
        GA SS GA DI PROSES<br><br>

        <div class="world-line">
            World :
            <span class="copy-text" onclick="copyText('50DO')">50DO</span>
            ( klik untuk salin )

            <span id="copied" class="copied">Copied!</span>
        </div>

    </div>

    <a class="whatsapp-btn"
       href="https://wa.me/6285175215549?text=Halo%20Admin,%20saya%20ingin%20membeli%20BGL"
       target="_blank">
       Kirim Bukti Donate + Grow ID di WhatsApp
    </a>

</div>

<script>

function copyText(text){
    navigator.clipboard.writeText(text).then(()=>{

        const copied = document.getElementById("copied");

        copied.style.opacity = "1";

        setTimeout(()=>{
            copied.style.opacity = "0";
        },5000);

    });
}

</script>

</body>
</html>
