<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop Layout</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #020617;
        color: white;
    }

    /* HEADER */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background-color: #0f172a;
        border-bottom: 1px solid #1e293b;
    }

    .logo img {
        height: 40px;
    }

    .header-right {
        width: 200px;
    }

    /* CONTAINER */
    .container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 15px;
    }

    /* SLIDER */
    .slider {
        width: 100%;
        max-width: 860px;
        height: 310px;
        margin: auto;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .slider img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* MENU SPACE */
    .menu-space {
        margin-top: 25px;
        height: 100px;
        background-color: #0f172a;
        border-radius: 12px;
        border: 1px solid #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #64748b;
    }

    /* CONTENT AREA */
    .content {
        margin-top: 25px;
        height: 350px;
        background-color: #020617;
        border-radius: 12px;
        border: 1px dashed #1e293b;
    }

</style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="Logo">
        </div>
        <div class="header-right"></div>
    </div>

    <!-- MAIN -->
    <div class="container">

        <!-- SLIDER -->
        <div class="slider">
            <img src="https://forgeplayid.github.io/desktop/gt-slider1.png" alt="Slider">
        </div>

        <!-- MENU -->
        <div class="menu-space">
            Area Menu / Navigasi (kosong dulu)
        </div>

        <!-- CONTENT -->
        <div class="content"></div>

    </div>

</body>
</html>
