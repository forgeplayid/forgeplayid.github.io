<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop Layout</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #020617;
        color: white;
    }

    /* HEADER */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background-color: #0f172a;
        border-bottom: 1px solid #1e293b;
    }

    .logo img {
        height: 40px;
    }

    .header-right {
        display: flex;
        align-items: center;
    }

    .header-right a.button {
        display: inline-block;
        padding: 8px 18px;
        background-color: #38bdf8;
        color: #020617;
        font-weight: bold;
        border-radius: 6px;
        text-decoration: none;
        transition: background-color 0.2s;
    }

    .header-right a.button:hover {
        background-color: #0ea5e9;
    }

    /* CONTAINER */
    .container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 15px;
    }

    /* SLIDER */
    .slider {
        width: 100%;
        max-width: 860px;
        margin: auto;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .slider img {
        width: 100%;
        height: auto; /* proporsional */
        display: block;
        border-radius: 12px;
    }

    /* MENU FRAME DL & BGL */
    .menu-frame {
        display: flex;
        justify-content: space-between;
        width: 100%;                 
        max-width: 860px;            
        margin: 25px auto 0 auto;
        padding: 0 10px;
        background-color: #0f172a;
        border-radius: 12px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    .menu-card {
        flex: 1;                       
        margin: 0 10px;
        background-color: #1e293b;
        border-radius: 10px;
        padding: 15px;
        text-align: center;
        color: white;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: transform 0.2s;
    }

    .menu-card:hover {
        transform: translateY(-5px);
    }

    .menu-card img.menu-img {
        width: 50px;  
        height: auto;
        margin-bottom: 10px;
    }

    .menu-card p {
        margin: 5px 0;
        font-size: 16px;
    }

    /* CONTENT AREA */
    .content {
        margin-top: 25px;
        height: 350px;
        background-color: #020617;
        border-radius: 12px;
        border: 1px dashed #1e293b;
    }

    /* RESPONSIVE */
    @media (max-width: 500px) {
        .menu-card {
            padding: 10px;
        }
        .menu-card img.menu-img {
            width: 40px;
        }
        .menu-card p {
            font-size: 14px;
        }
        .header {
            flex-direction: column;
            align-items: flex-start;
        }
        .header-right {
            margin-top: 10px;
        }
    }

</style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="Logo">
        </div>
        <div class="header-right">
            <a href="https://forgeplayid.github.io/desktop/world" class="button">Cari World Disini</a>
        </div>
    </div>

    <!-- MAIN -->
    <div class="container">

        <!-- SLIDER -->
        <div class="slider">
            <img src="https://forgeplayid.github.io/assets/gt-slider1.png" alt="Slider">
        </div>

        <!-- MENU DL & BGL -->
        <div class="menu-frame">
            <!-- DL -->
            <div class="menu-card">
                <img src="https://forgeplayid.github.io/assets/diamond-lock.png" alt="DL" class="menu-img">
                <p>Sell Rp. 190</p>
                <p>Buy Rp. 180</p>
            </div>
            <!-- BGL -->
            <div class="menu-card">
                <img src="https://forgeplayid.github.io/assets/blue-gem-lock.png" alt="BGL" class="menu-img">
                <p>Sell Rp. 19.000</p>
            </div>
        </div>

        <!-- CONTENT AREA -->
        <div class="content"></div>

    </div>

</body>
</html>
