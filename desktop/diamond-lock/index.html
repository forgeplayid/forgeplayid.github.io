<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://uniplay.id/cdn/fb64-pic2d7fab3824dd00bb3c05f0002b466e6c1762906411.png">
<title>Pembayaran Diamond Lock</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        background-color: #020617;
        color: white;
    }

    /* ================= HEADER ================= */
    .header {
        position: relative; /* 🔥 penting supaya CCTV nempel */
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background-color: #0f172a;
        border-bottom: 1px solid #1e293b;
    }

    .logo img { height: 35px; }

    .header-right {
        display: flex;
        align-items: center;
    }

    .header-right a.button {
        display: inline-block;
        padding: 8px 18px;
        background-color: #38bdf8;
        color: #020617;
        font-weight: 600;
        border-radius: 6px;
        text-decoration: none;
        transition: background-color 0.2s;
    }

    .header-right a.button:hover {
        background-color: #0ea5e9;
    }

    /* ================= 🔥 CCTV GIF ================= */
    .cctv-gif {
        position: absolute;
        top: 58px;     /* turun biar tidak nabrak garis header */
        left: 70px;    /* geser ke kiri dekat logo */
        width: 80px;   /* ukuran kecil CCTV */
        height: auto;
        z-index: 10;
        opacity: 0.95;
        pointer-events: none;
    }

    .container {
        max-width: 1000px;
        margin: 30px auto;
        padding: 0 15px;
        text-align: center;
    }

    h1 {
        color: #38bdf8;
        margin-bottom: 20px;
        font-weight: 700;
    }

    .logo-dl { margin-bottom: 15px; }
    .logo-dl img { height: 100px; }

    .payment-frame {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 25px;
    }

    .payment-card {
        flex: 1;
        background: linear-gradient(145deg, #0f172a, #1e3a8a);
        border-radius: 16px;
        padding: 0;
        cursor: pointer;
        overflow: hidden;
        transition: all 0.25s ease;
    }

    .payment-card:hover {
        transform: translateY(-8px) scale(1.03);
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
    }

    .payment-card img {
        width: 100%;
        height: auto;
        display: block;
    }

    #rekening-info {
        margin-top: 30px;
        padding: 15px;
        background-color: #0f172a;
        border-radius: 12px;
        font-size: 16px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        min-height: 50px;
    }

    .qris-container img {
        width: 260px;
        max-width: 90%;
        height: auto;
        display: block;
        margin: 0 auto 10px auto;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .qris-container img:hover {
        transform: scale(1.05);
    }

    .qris-container p {
        margin: 0;
        font-size: 16px;
        color: #cbd5f5;
        font-weight: 600;
    }

    .whatsapp-button {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background-color: #25D366;
        color: #020617;
        font-weight: 600;
        border-radius: 8px;
        text-decoration: none;
        transition: background-color 0.2s;
    }

    .whatsapp-button:hover {
        background-color: #1ebe57;
    }

    @media (max-width: 500px) {
        .header { flex-direction: column; align-items: flex-start; }
        .header-right { margin-top: 10px; }

        .payment-frame {
            flex-direction: column;
            gap: 15px;
        }

        .cctv-gif {
            left: 40px;
            top: 55px;
            width: 65px;
        }
    }
</style>
</head>

<body>

<div class="header">
    <div class="logo">
        <a href="https://forgeplayid.github.io/">
            <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png">
        </a>
    </div>

    <div class="header-right">
        <a href="https://forgeplayid.github.io/desktop/world" class="button">Cari World Disini</a>
    </div>

    <!-- 🔥 CCTV GIF (SAMA POSISI DENGAN SCRIPT SEBELUMNYA) -->
    <img class="cctv-gif" src="https://forgeplayid.github.io/assets/cctv-growtopia.gif">

</div>

<div class="container">

    <div class="logo-dl">
        <img src="https://forgeplayid.github.io/assets/diamond-lock.png">
    </div>

    <h1>Pembayaran Diamond Lock ( DL )</h1>

    <div class="payment-frame">
        <div class="payment-card" onclick="showRekening('BCA')">
            <img src="https://forgeplayid.github.io/assets/bca.png">
        </div>

        <div class="payment-card" onclick="showRekening('BRI')">
            <img src="https://forgeplayid.github.io/assets/bri.png">
        </div>

        <div class="payment-card" onclick="showRekening('QRIS')">
            <img src="https://forgeplayid.github.io/assets/qris.png">
        </div>
    </div>

    <div id="rekening-info">
        Klik salah satu metode pembayaran untuk melihat nomor rekening / QRIS
    </div>

    <a id="whatsapp-link"
       href="https://wa.me/6285175215549?text=Halo%20Admin,%20saya%20ingin%20membeli%20DL"
       target="_blank"
       class="whatsapp-button">
       Kirim Bukti transaksi + World ID + Grow ID di WhatsApp
    </a>

</div>

<script>
const rekeningData = {
    BCA: "BCA 1234567890 a.n. Nama Pemilik",
    BRI: "BRI 0987654321 a.n. Nama Pemilik",
    QRIS: `
        <div class="qris-container">
            <img src="https://forgeplayid.github.io/assets/forgeplayid-qris.png"
                 alt="QRIS"
                 onclick="this.style.transform = (this.style.transform === 'scale(1.5)') ? 'scale(1)' : 'scale(1.5)';">
            <p>Silahkan Scan QRIS diatas</p>
        </div>
    `
};

function showRekening(bank) {
    const info = document.getElementById('rekening-info');

    if(bank === 'QRIS') {
        info.innerHTML = rekeningData[bank];
    } else {
        info.textContent = rekeningData[bank];
    }

    const waNumber = "6281234567890";
    const message = encodeURIComponent(`Halo Admin, saya sudah melakukan pembayaran Diamond Lock via ${bank}. Bukti transaksi + World ID + Grow ID`);
    document.getElementById('whatsapp-link').href =
        `https://wa.me/${waNumber}?text=${message}`;
}
</script>

</body>
</html>
