<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://uniplay.id/cdn/fb64-pic2d7fab3824dd00bb3c05f0002b466e6c1762906411.png">
<title>Pembayaran Blue Gem Lock</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        background-color: #020617;
        color: white;
    }

    /* ================= HEADER ================= */
    .header {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background-color: #0f172a;
        border-bottom: 1px solid #1e293b;
    }

    .logo img { height: 35px; }

    .header-right a.button {
        padding: 8px 18px;
        background-color: #38bdf8;
        color: #020617;
        font-weight: 600;
        border-radius: 6px;
        text-decoration: none;
    }

    /* ================= CCTV FIX FINAL ================= */
    .cctv-gif {
        position: absolute;
        left: 70px;
        top: 58px;
        width: 80px;
        height: auto;
        z-index: 10;
        opacity: 0.95;
        pointer-events: none;
    }

    .container {
        max-width: 1000px;
        margin: 30px auto;
        padding: 0 15px;
        text-align: center;
    }

    h1 {
        color: #38bdf8;
        margin-bottom: 20px;
        font-weight: 700;
    }

    .logo-dl img {
        height: 100px;
    }

    .payment-frame {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-top: 25px;
    }

    .payment-card {
        background: linear-gradient(145deg, #0f172a, #1e3a8a);
        border: 1px solid rgba(56, 189, 248, 0.18);
        border-radius: 18px;
        padding: 14px;
        cursor: pointer;
        overflow: hidden;
        transition: 0.25s;
        box-shadow: 0 8px 20px rgba(0,0,0,0.22);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 120px;
    }

    .payment-card:hover {
        transform: translateY(-8px) scale(1.03);
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        border-color: rgba(56, 189, 248, 0.45);
    }

    .payment-card img {
        max-width: 100%;
        max-height: 80px;
        width: auto;
        height: auto;
        display: block;
        object-fit: contain;
    }

    #rekening-info {
        margin-top: 30px;
        padding: 15px;
        background-color: #0f172a;
        border-radius: 12px;
    }

    .qris-container img {
        width: 260px;
        max-width: 90%;
    }

    .whatsapp-button {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background-color: #25D366;
        color: #020617;
        font-weight: 600;
        border-radius: 8px;
        text-decoration: none;
    }

    /* ================= MOBILE ================= */
    @media (max-width: 900px) {
        .payment-frame {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 500px) {
        .payment-frame {
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .payment-card {
            min-height: 110px;
        }

        .cctv-gif {
            left: 40px;
            top: 55px;
            width: 65px;
        }
    }
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <div class="logo">
        <a href="https://forgeplayid.github.io/">
            <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png">
        </a>
    </div>

    <div class="header-right">
        <a href="https://forgeplayid.github.io/desktop/world" class="button">Cari World Disini</a>
    </div>

    <!-- CCTV FIX FINAL POSISI -->
    <img class="cctv-gif" src="https://forgeplayid.github.io/assets/cctv-growtopia.gif">

</div>

<!-- CONTENT -->
<div class="container">

    <div class="logo-dl">
        <img src="https://forgeplayid.github.io/assets/blue-gem-lock.png">
    </div>

    <h1>Pembayaran Blue Gem Lock ( BGL )</h1>

    <div class="payment-frame">
        <div class="payment-card" onclick="showRekening('BCA')">
            <img src="https://forgeplayid.github.io/assets/bca.png" alt="BCA">
        </div>

        <div class="payment-card" onclick="showRekening('BRI')">
            <img src="https://forgeplayid.github.io/assets/bri.png" alt="BRI">
        </div>

        <div class="payment-card" onclick="showRekening('QRIS')">
            <img src="https://forgeplayid.github.io/assets/qris.png" alt="QRIS">
        </div>

        <div class="payment-card" onclick="showRekening('PAYPAL')">
            <img src="https://www.paypalobjects.com/webstatic/icon/pp258.png" alt="PayPal">
        </div>
    </div>

    <div id="rekening-info">
        Klik salah satu metode pembayaran untuk melihat nomor rekening / QRIS / link PayPal
    </div>

    <a class="whatsapp-button"
       href="https://wa.me/6285175215549"
       target="_blank">
       Kirim Bukti transaksi + World ID + Grow ID di WhatsApp
    </a>

</div>

<script>
const rekeningData = {
    BCA: "BCA 1234567890 a.n. Nama Pemilik",
    BRI: "BRI 0987654321 a.n. Nama Pemilik",
    QRIS: `
        <div class="qris-container">
            <img src="https://forgeplayid.github.io/assets/forgeplayid-qris.png">
            <p>Silahkan Scan QRIS diatas</p>
        </div>
    `,
    PAYPAL: `
        <div class="qris-container">
            <a href="https://paypal.me/andiyoyo" target="_blank" style="color:#38bdf8;font-weight:700;text-decoration:none;font-size:18px;">
                paypal.me/andiyoyo
            </a>
            <p style="margin-top:10px;">Klik link di atas untuk melakukan pembayaran via PayPal</p>
        </div>
    `
};

function showRekening(bank) {
    const info = document.getElementById('rekening-info');

    if(bank === 'QRIS' || bank === 'PAYPAL') {
        info.innerHTML = rekeningData[bank];
    } else {
        info.textContent = rekeningData[bank];
    }
}
</script>

</body>
</html>
