<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran Blue Gem Lock</title>

<!-- Google Font Montserrat -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        background-color: #020617;
        color: white;
    }

    /* HEADER UTAMA */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background-color: #0f172a;
        border-bottom: 1px solid #1e293b;
    }

    .logo img {
        height: 35px;
    }

    .header-right {
        display: flex;
        align-items: center;
    }

    .header-right a.button {
        display: inline-block;
        padding: 8px 18px;
        background-color: #38bdf8;
        color: #020617;
        font-weight: 600;
        border-radius: 6px;
        text-decoration: none;
        transition: background-color 0.2s;
        font-family: 'Montserrat', sans-serif;
    }

    .header-right a.button:hover {
        background-color: #0ea5e9;
    }

    /* CONTAINER */
    .container {
        max-width: 860px;
        margin: 30px auto;
        padding: 0 15px;
        text-align: center;
    }

    h1 {
        color: #38bdf8;
        margin-bottom: 20px;
        font-weight: 700;
    }

    /* LOGO BLUE GEM LOCK */
    .logo-dl {
        margin-bottom: 15px;
    }

    .logo-dl img {
        height: 100px;
    }

    /* PAYMENT FRAME */
    .payment-frame {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
    }

    .payment-card {
        flex: 1;
        margin: 0 10px;
        background-color: #1e293b;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.2s;
    }

    .payment-card:hover {
        transform: translateY(-5px);
        background-color: #0f172a;
    }

    .payment-card img {
        width: 60px;
        margin-bottom: 10px;
    }

    .payment-card p {
        margin: 5px 0;
        font-size: 16px;
        font-weight: 600;
    }

    #rekening-info {
        margin-top: 25px;
        padding: 15px;
        background-color: #0f172a;
        border-radius: 12px;
        font-size: 16px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        min-height: 50px;
    }

    /* QRIS IMAGE */
    .qris-container img {
        max-width: 300px;
        width: 80%;
        height: auto;
        display: block;
        margin: 0 auto 10px auto;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .qris-container img:hover {
        transform: scale(1.05);
    }

    .qris-container p {
        margin: 0;
        font-size: 16px;
        color: #cbd5f5;
        font-weight: 600;
    }

    .whatsapp-button {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background-color: #25D366;
        color: #020617;
        font-weight: 600;
        border-radius: 8px;
        text-decoration: none;
        transition: background-color 0.2s;
    }

    .whatsapp-button:hover {
        background-color: #1ebe57;
    }

    /* RESPONSIVE */
    @media (max-width: 500px) {
        .header {
            flex-direction: column;
            align-items: flex-start;
        }
        .header-right {
            margin-top: 10px;
        }
        .payment-frame {
            flex-direction: column;
        }
        .payment-card {
            margin: 10px 0;
        }
    }
</style>
</head>
<body>

<!-- HEADER UTAMA -->
<div class="header">
    <div class="logo">
        <a href="https://forgeplayid.github.io/">
            <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="Logo">
        </a>
    </div>
    <div class="header-right">
        <a href="https://forgeplayid.github.io/desktop/world" class="button">Cari World Disini</a>
    </div>
</div>

<div class="container">

    <!-- LOGO BLUE GEM LOCK -->
    <div class="logo-dl">
        <img src="https://forgeplayid.github.io/assets/blue-gem-lock.png" alt="Blue Gem Lock Logo">
    </div>

    <!-- JUDUL PEMBAYARAN -->
    <h1>Pembayaran Blue Gem Lock ( BGL )</h1>

    <!-- PAYMENT FRAME -->
    <div class="payment-frame">
        <div class="payment-card" onclick="showRekening('BCA')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/BCA_logo.svg/2560px-BCA_logo.svg.png" alt="BCA">
            <p>BCA</p>
        </div>
        <div class="payment-card" onclick="showRekening('BRI')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/BRI_logo.svg" alt="BRI">
            <p>BRI</p>
        </div>
        <div class="payment-card" onclick="showRekening('QRIS')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/3b/QRIS_Logo.png" alt="QRIS">
            <p>QRIS</p>
        </div>
    </div>

    <!-- REKENING INFO -->
    <div id="rekening-info">Klik salah satu metode pembayaran untuk melihat nomor rekening / QRIS</div>

    <!-- WHATSAPP BUTTON -->
    <a id="whatsapp-link" 
       href="https://wa.me/6285175215549?text=Halo%20Admin,%20saya%20ingin%20membeli%20BGL" 
       target="_blank" 
       class="whatsapp-button">
       Kirim Bukti transaksi + World ID + Grow ID di WhatsApp
    </a>

</div>

<script>
    const rekeningData = {
        BCA: "BCA 1234567890 a.n. Nama Pemilik",
        BRI: "BRI 0987654321 a.n. Nama Pemilik",
        QRIS: `
            <div class="qris-container">
                <img src="https://forgeplayid.github.io/assets/forgeplayid-qris.png" 
                     alt="QRIS" 
                     onclick="this.style.transform = (this.style.transform === 'scale(1.5)') ? 'scale(1)' : 'scale(1.5)';">
                <p>Silahkan Scan QRIS diatas</p>
            </div>
        `
    };

    function showRekening(bank) {
        const info = document.getElementById('rekening-info');

        if(bank === 'QRIS') {
            info.innerHTML = rekeningData[bank];
        } else {
            info.textContent = rekeningData[bank];
        }

        // Update WhatsApp link otomatis
        const waNumber = "6281234567890"; // ganti nomor admin
        const message = encodeURIComponent(`Halo Admin, saya sudah melakukan pembayaran Blue Gem Lock via ${bank}. Bukti transaksi + World ID + Grow ID`);
        document.getElementById('whatsapp-link').href = `https://wa.me/${waNumber}?text=${message}`;
    }
</script>

</body>
</html>
