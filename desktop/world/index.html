<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daftar World Responsif Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
body {
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:#020617;
  color:white;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;
}

.logo img { height:35px; }
.header-right a {
  padding:8px 18px;
  background:#38bdf8;
  color:#020617;
  font-weight:600;
  border-radius:6px;
  text-decoration:none;
}

/* TITLE */
.title-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1200px;
  margin:30px auto 10px auto;
  padding:0 15px;
}

.title-bar h1{
  margin:0;
  color:#38bdf8;
}

/* SORT BOX */
.sort-box{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 10px;
  border:1px solid #38bdf8;
  border-radius:8px;
  background:#0f172a;
  font-size:13px;
  font-weight:600;
  color:#38bdf8;
}

/* TOGGLE */
.switch {
  position: relative;
  width:46px;
  height:24px;
}

.switch input { display:none; }

.slider-toggle {
  position:absolute;
  inset:0;
  background:#1e293b;
  border-radius:999px;
  cursor:pointer;
  transition:.3s;
  border:1px solid #334155;
}

.slider-toggle:before {
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  left:3px;
  top:2px;
  background:white;
  border-radius:50%;
  transition:.3s;
}

.switch input:checked + .slider-toggle {
  background:#22c55e;
}

.switch input:checked + .slider-toggle:before {
  transform:translateX(22px);
}

/* GRID */
.container{
  max-width:1200px;
  margin:10px auto 50px;
  padding:0 15px;
}

.world-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

/* CARD */
.world-card{
  background:#1e293b;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 6px 15px rgba(0,0,0,0.3);
  will-change: transform, opacity;
}

/* IMAGE */
.world-image{
  position:relative;
  padding-top:calc(798/1280*100%);
  background:#0f172a;
}

.world-image img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  cursor:zoom-in;
}

/* DESC */
.world-desc{
  padding:15px;
  font-size:14px;
  color:#cbd5f5;
}

/* BUTTON */
.buy-button{
  display:block;
  margin:15px auto 20px;
  padding:10px 20px;
  width:70%;
  text-align:center;
  border-radius:8px;
  font-weight:600;
  text-decoration:none;
}

/* STATUS */
.status-ready{ color:#22c55e; font-weight:700; }
.status-sold{ color:#ef4444; font-weight:700; }

/* ZOOM */
.zoom-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
}
.zoom-overlay.active{ display:flex; }

.zoom-overlay img{
  max-width:90%;
  max-height:90%;
  border-radius:12px;
}

/* RESPONSIVE */
@media(max-width:1024px){ .world-grid{grid-template-columns:repeat(3,1fr);} }
@media(max-width:700px){ .world-grid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:400px){ .world-grid{grid-template-columns:1fr;} }

</style>
</head>

<body>

<div class="header">
  <div class="logo">
    <a href="https://forgeplayid.github.io/">
      <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png">
    </a>
  </div>

  <div class="header-right">
    <a href="https://forgeplayid.github.io/desktop/">← BACK</a>
  </div>
</div>

<!-- TITLE -->
<div class="title-bar">
  <h1>Daftar World</h1>

  <div class="sort-box">
    SORT
    <label class="switch">
      <input type="checkbox" id="sortToggle">
      <span class="slider-toggle"></span>
    </label>
  </div>
</div>

<div class="container">
  <div class="world-grid" id="grid"></div>
</div>

<div class="zoom-overlay" id="zoomOverlay">
  <img id="zoomedImage">
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxeNnRvtTbuacVFi1vX3fy1HvpKeEZgfJXKBGoh_13njwmY2y4hbR7E-WgsLhgBDr5YBA/exec";

const grid = document.getElementById("grid");
const toggle = document.getElementById("sortToggle");

let rawData = [];

toggle.addEventListener("change", render);

async function loadWorlds(){
  const res = await fetch(API);
  rawData = await res.json();
  render();
}

/* =========================
   FLIP ANIMATION SORT FIX
========================= */
function render(){

  const first = {};
  document.querySelectorAll(".world-card").forEach(el=>{
    first[el.dataset.id] = el.getBoundingClientRect();
  });

  let data = [...rawData];

  if(toggle.checked){
    data.sort((a,b)=>{
      const A = (a.status||"").toUpperCase()==="READY" ? 0 : 1;
      const B = (b.status||"").toUpperCase()==="READY" ? 0 : 1;
      return A - B;
    });
  }

  const newEls = [];

  data.forEach(item=>{
    if(!item.name) return;

    const isSold = (item.status||"").toUpperCase()==="SOLD";

    const el = document.createElement("div");
    el.className = "world-card";
    el.dataset.id = item.name;

    el.innerHTML = `
      <div class="world-image">
        <img src="${item.image}" class="zoom-img">
      </div>

      <div class="world-desc">
        <strong>WORLD: ${item.name}</strong>
        <p class="${isSold?'status-sold':'status-ready'}">${item.status||"READY"}</p>
        <p>${item.desc ? item.desc.replace(/\n/g,"<br>") : ""}</p>
      </div>

      <a class="buy-button"
         style="background:${isSold?'#ef4444':'#22c55e'};color:#020617"
         href="${isSold?'#':'https://wa.me/6285175215549?text=Saya%20ingin%20membeli%20world%20'+encodeURIComponent(item.name)}">
         ${isSold?'SOLD':'BUY WORLD'}
      </a>
    `;

    newEls.push(el);
  });

  grid.innerHTML = "";
  newEls.forEach(el=>grid.appendChild(el));

  /* FLIP ANIMATION */
  newEls.forEach(el=>{
    const last = el.getBoundingClientRect();
    const firstPos = first[el.dataset.id];

    if(firstPos){
      const dx = firstPos.left - last.left;
      const dy = firstPos.top - last.top;

      el.animate([
        { transform:`translate(${dx}px,${dy}px)` },
        { transform:"translate(0,0)" }
      ],{
        duration:400,
        easing:"ease"
      });
    }
  });

  document.querySelectorAll(".zoom-img").forEach(img=>{
    img.onclick = ()=>{
      document.getElementById("zoomOverlay").classList.add("active");
      document.getElementById("zoomedImage").src = img.src;
    };
  });
}

/* ZOOM CLOSE */
document.getElementById("zoomOverlay").onclick = ()=>{
  document.getElementById("zoomOverlay").classList.remove("active");
};

loadWorlds();

</script>

</body>
</html>
