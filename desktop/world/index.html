<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daftar World Responsif Grid</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
    body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        background-color: #020617;
        color: white;
    }

    /* HEADER */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background-color: #0f172a;
        border-bottom: 1px solid #1e293b;
    }

    .logo img {
        height: 35px;
    }

    .logo a {
        text-decoration: none;
    }

    .header-right a {
        padding: 8px 18px;
        background-color: #38bdf8;
        color: #020617;
        font-weight: 600;
        border-radius: 6px;
        text-decoration: none;
    }

    /* CONTAINER */
    .container {
        max-width: 1200px;
        margin: 30px auto 50px auto;
        padding: 0 15px;
    }

    h1 {
        text-align: center;
        color: #38bdf8;
        margin-bottom: 25px;
    }

    /* GRID with CSS Grid */
    .world-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        justify-items: center; /* Center the cards horizontally */
    }

    /* Cards */
    .world-card {
        width: 100%;
        max-width: 280px; /* Max width per card */
        background-color: #1e293b;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        transition: transform 0.2s;
        display: flex;
        flex-direction: column;
        cursor: default;
    }

    .world-card:hover {
        transform: translateY(-5px);
    }

    /* IMAGE container with fixed aspect ratio */
    .world-image {
        width: 100%;
        position: relative;
        padding-top: calc(798 / 1280 * 100%); /* aspect ratio 1280x798 */
        background-color: #0f172a;
        overflow: hidden;
    }

    /* Absolute positioning for image inside */
    .world-image img {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%;
        height: 100%;
        object-fit: contain; /* preserve aspect ratio, no cropping */
        cursor: zoom-in;
        transition: transform 0.3s ease;
        display: block;
        border-bottom: 1px solid #1e293b;
        user-select: none;
    }

    /* DESC */
    .world-desc {
        padding: 15px;
        font-size: 14px;
        color: #cbd5f5;
        flex-grow: 1;
    }

    .world-desc ul {
        padding-left: 18px;
        margin: 8px 0 0 0;
    }

    .world-desc li {
        margin-bottom: 4px;
    }

    /* BUTTON */
    .buy-button {
        display: block;
        margin: 15px auto 20px auto;
        padding: 10px 20px;
        background-color: #22c55e;
        color: #020617;
        font-weight: 600;
        border-radius: 8px;
        text-decoration: none;
        text-align: center;
        width: 70%;
        transition: background-color 0.2s;
        cursor: pointer;
    }

    .buy-button:hover {
        background-color: #16a34a;
    }

    /* ZOOM OVERLAY */
    .zoom-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        cursor: zoom-out;
        z-index: 9999;
        padding: 15px;
    }

    .zoom-overlay.active {
        display: flex;
    }

    .zoom-overlay img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 12px;
        box-shadow: 0 0 30px rgba(255,255,255,0.6);
        cursor: zoom-out;
        transform: scale(1);
        transition: transform 0.3s ease;
        user-select: none;
    }

    .zoom-overlay img.zoom-animate {
        transform: scale(1.2);
    }

    /* RESPONSIVE */

    /* Tablet: 3 columns */
    @media (max-width: 1024px) {
        .world-grid {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    /* Mobile Large: 2 columns */
    @media (max-width: 700px) {
        .world-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* Mobile Small: 1 column */
    @media (max-width: 400px) {
        .world-grid {
            grid-template-columns: 1fr;
        }
    }

    /* Header mobile tweaks */
    @media (max-width: 500px) {
        .header {
            flex-direction: column;
            align-items: flex-start;
        }
        .header-right {
            margin-top: 10px;
        }
    }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">
        <a href="https://forgeplayid.github.io/">
            <img src="https://uniplay.id/cdn/fb64-pic7e8f1bd435ca11fd8066efbd8fe70a0c1762907822.png" alt="Forgeplay Logo" />
        </a>
    </div>
    <div class="header-right">
        <a href="https://forgeplayid.github.io/desktop/">← BACK</a>
    </div>
</div>

<div class="container">
    <h1>Daftar World</h1>

    <div class="world-grid">

        <!-- CARD 1 -->
        <div class="world-card">
            <div class="world-image">
                <img src="https://forgeplayid.github.io/assets/nfcxy.png" alt="NFCXY" class="zoomable-image" />
            </div>
            <div class="world-desc">
                <strong>Deskripsi : NFCXY</strong>
                <ul>
                    <li>Clear</li>
                    <li>Name 5 Letter</li>
                    <li>Harga : 10 DL</li>
                    <li>NEGO? PM AJA!</li>
                </ul>
            </div>
            <a href="https://wa.me/6285175215549?text=Saya%20ingin%20membeli%20world%20NFCXY" class="buy-button" target="_blank">BUY WORLD</a>
        </div>

        <!-- CARD 2 -->
        <div class="world-card">
            <div class="world-image">COMING SOON</div>
            <div class="world-desc">World 2 - Deskripsi singkat</div>
            <a href="https://wa.me/6281234567890?text=Saya%20ingin%20membeli%20world%202" class="buy-button" target="_blank">BUY WORLD</a>
        </div>

        <!-- CARD 3 -->
        <div class="world-card">
            <div class="world-image">COMING SOON</div>
            <div class="world-desc">World 3 - Deskripsi singkat</div>
            <a href="https://wa.me/6281234567890?text=Saya%20ingin%20membeli%20world%203" class="buy-button" target="_blank">BUY WORLD</a>
        </div>

        <!-- CARD 4 -->
        <div class="world-card">
            <div class="world-image">COMING SOON</div>
            <div class="world-desc">World 4 - Deskripsi tambahan</div>
            <a href="https://wa.me/6281234567890?text=Saya%20ingin%20membeli%20world%204" class="buy-button" target="_blank">BUY WORLD</a>
        </div>

    </div>
</div>

<!-- Zoom Overlay -->
<div id="zoomOverlay" class="zoom-overlay" tabindex="0" aria-hidden="true">
    <img id="zoomedImage" src="" alt="Zoomed World Image" />
</div>

<script>
    const zoomOverlay = document.getElementById('zoomOverlay');
    const zoomedImage = document.getElementById('zoomedImage');
    const zoomableImages = document.querySelectorAll('.zoomable-image');

    zoomableImages.forEach(img => {
        img.addEventListener('click', () => {
            zoomedImage.src = img.src;
            zoomOverlay.classList.add('active');
            zoomOverlay.setAttribute('aria-hidden', 'false');

            zoomedImage.classList.add('zoom-animate');
            setTimeout(() => {
                zoomedImage.classList.remove('zoom-animate');
            }, 300);
        });
    });

    // Tutup saat klik area luar gambar (overlay)
    zoomOverlay.addEventListener('click', (e) => {
        if (e.target === zoomOverlay) {
            zoomOverlay.classList.remove('active');
            zoomedImage.src = '';
            zoomOverlay.setAttribute('aria-hidden', 'true');
        }
    });

    // Tutup saat klik gambar
    zoomedImage.addEventListener('click', () => {
        zoomOverlay.classList.remove('active');
        zoomedImage.src = '';
        zoomOverlay.setAttribute('aria-hidden', 'true');
    });

    // Tutup dengan tombol ESC
    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape" && zoomOverlay.classList.contains('active')) {
            zoomOverlay.classList.remove('active');
            zoomedImage.src = '';
            zoomOverlay.setAttribute('aria-hidden', 'true');
        }
    });
</script>

</body>
</html>
